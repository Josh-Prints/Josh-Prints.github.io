<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order - JoshPrints</title>
<style>
  :root{
    --bg: #f6f8fa;
    --bg-raised: #ffffff;
    --grid-line: rgba(0,0,0,0);
    --ink: #1f2328;
    --ink-dim: #656d76;
    --accent: #0969da;
    --accent-dim: #0969da1f;
    --ok: #1a7f37;
    --ok-dim: #1a7f371f;
    --warn: #9a6700;
    --err: #cf222e;
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 34px,
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap{ max-width: 620px; margin: 0 auto; padding: 48px 20px 80px; }

  h1{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 28px;
  }
  h1 span{ color: var(--accent); }

  #loading, #not-found{
    text-align: center;
    color: var(--ink-dim);
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    padding: 80px 0;
  }

  #order-view{ display: none; }

  .card{
    background: var(--bg-raised);
    border: 1px solid rgba(31,35,40,0.10);
    border-radius: var(--radius);
    padding: 24px 26px;
    margin-bottom: 18px;
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .status-pill{
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .status-pill .dot{ width: 7px; height: 7px; border-radius: 50%; }
  .status-new{ background: var(--accent-dim); color: var(--accent); }
  .status-new .dot{ background: var(--accent); }
  .status-quoted{ background: rgba(154,103,0,0.14); color: var(--warn); }
  .status-quoted .dot{ background: var(--warn); }
  .status-in_progress{ background: rgba(9,105,218,0.14); color: #0969da; }
  .status-in_progress .dot{ background: #0969da; }
  .status-completed{ background: var(--ok-dim); color: var(--ok); }
  .status-completed .dot{ background: var(--ok); }
  .status-cancelled{ background: rgba(101,109,118,0.14); color: #656d76; }
  .status-cancelled .dot{ background: #656d76; }

  .quote-amount{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .detail-row{
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-top: 1px solid rgba(31,35,40,0.08);
    font-size: 13.5px;
  }
  .detail-row:first-of-type{ border-top: none; }
  .detail-row .label{
    color: var(--ink-dim);
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .detail-row .value{ text-align: right; max-width: 60%; }

  .file-link{
    display: inline-block;
    margin-top: 6px;
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
  }
  .file-link:hover{ text-decoration: underline; }

  .card h2{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    margin: 0 0 14px;
  }

  #messages{
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 420px;
    overflow-y: auto;
    margin-bottom: 16px;
    padding-right: 2px;
  }

  .msg{
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 6px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .msg.customer{
    align-self: flex-end;
    background: var(--accent-dim);
    border: 1px solid rgba(9,105,218,0.3);
    border-bottom-right-radius: 2px;
  }
  .msg.admin{
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid rgba(31,35,40,0.12);
    border-bottom-left-radius: 2px;
  }
  .msg .who{
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .msg .file-link{ margin-top: 8px; }
  .msg-empty{
    text-align: center;
    color: var(--ink-dim);
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12.5px;
    padding: 20px 0;
  }

  .deleted-notice{
    text-align: center;
    color: var(--err);
    background: rgba(207,34,46,0.1);
    border: 1px solid rgba(207,34,46,0.3);
    border-radius: 8px;
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12.5px;
    padding: 14px;
  }

  .composer{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .composer textarea{
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(31,35,40,0.18);
    border-radius: 8px;
    color: var(--ink);
    padding: 11px 13px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    font-size: 14px;
    resize: vertical;
    min-height: 60px;
    outline: none;
  }
  .composer textarea:focus{ border-color: var(--accent); }
  .composer-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .attach-btn{
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    background: none;
    border: 1px dashed rgba(31,35,40,0.25);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .attach-btn input{
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .attach-name{
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 11.5px;
    color: var(--accent);
  }
  .send-btn{
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 7px;
    padding: 10px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
  }
  .send-btn:disabled{ opacity: .6; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Josh<span>Prints</span></h1>

  <div id="loading">Loading your order…</div>
  <div id="not-found" style="display:none;">Couldn't find that order. Double check the link you were sent.</div>

  <div id="order-view">
    <div class="card">
      <div class="status-row">
        <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text"></span></span>
        <span class="quote-amount" id="quote-amount"></span>
      </div>
      <div class="detail-row"><span class="label">Name</span><span class="value" id="d-name"></span></div>
      <div class="detail-row"><span class="label">Order type</span><span class="value" id="d-type"></span></div>
      <div class="detail-row" id="d-notes-row"><span class="label">Notes</span><span class="value" id="d-notes"></span></div>
      <div class="detail-row" id="d-file-row" style="display:none;">
        <span class="label">File</span>
        <span class="value"><a href="#" class="file-link" id="d-file-link" target="_blank"></a></span>
      </div>
      <div class="detail-row"><span class="label">Submitted</span><span class="value" id="d-created"></span></div>
    </div>

    <div class="card">
      <h2>Messages</h2>
      <div id="messages"></div>
      <div id="deleted-notice" class="deleted-notice" style="display:none;">This order has been deleted. Messaging is closed.</div>
      <div class="composer" id="composer-wrap">
        <textarea id="msg-body" placeholder="Write a message…"></textarea>
        <div class="composer-row">
          <button type="button" class="attach-btn" id="attach-btn">
            <span id="attach-label">📎 Attach file</span>
            <input type="file" id="attach-input" multiple>
          </button>
          <button type="button" class="send-btn" id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://paycasfatsakidsriwqt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Yk3l_-tXm4qtaRnrfw54pw_Awel9tCv';
  const BUCKET = 'order-files';
  const POLL_MS = 3000;

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order');

  const loadingEl = document.getElementById('loading');
  const notFoundEl = document.getElementById('not-found');
  const orderView = document.getElementById('order-view');
  const messagesEl = document.getElementById('messages');

  const STATUS_LABEL = {
    new: 'New', quoted: 'Quoted', in_progress: 'In progress',
    completed: 'Completed', cancelled: 'Cancelled'
  };

  let attachedFiles = [];
  let lastMessageCount = -1;
  let lastStatusSnapshot = null;

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function publicFileUrl(path){
    return supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  if (!orderId){
    loadingEl.style.display = 'none';
    notFoundEl.style.display = 'block';
  } else {
    init();
  }

  async function init(){
    const ok = await loadOrder();
    if (!ok){
      loadingEl.style.display = 'none';
      notFoundEl.style.display = 'block';
      return;
    }

    loadingEl.style.display = 'none';
    orderView.style.display = 'block';

    loadMessages();
    setInterval(loadMessages, POLL_MS);
    setInterval(loadOrder, POLL_MS);
  }

  async function loadOrder(){
    const { data: order, error } = await supabase.rpc('get_order', { p_id: orderId });
    const orderRow = Array.isArray(order) ? order[0] : order;
    if (error || !orderRow) return false;

    const snapshot = `${orderRow.status}|${orderRow.quote_amount}`;
    if (snapshot !== lastStatusSnapshot){
      lastStatusSnapshot = snapshot;
      renderOrder(orderRow);
    }
    return true;
  }

  function renderOrder(order){
    if (order.deleted){
      document.getElementById('status-pill').className = 'status-pill status-cancelled';
      document.getElementById('status-text').textContent = 'Deleted';
      document.getElementById('quote-amount').textContent = '';
      document.getElementById('deleted-notice').style.display = 'block';
      document.getElementById('composer-wrap').style.display = 'none';
    } else {
      document.getElementById('deleted-notice').style.display = 'none';
      document.getElementById('composer-wrap').style.display = 'flex';
    }

    document.getElementById('status-pill').className = order.deleted
      ? 'status-pill status-cancelled'
      : 'status-pill status-' + order.status;
    document.getElementById('status-text').textContent = order.deleted
      ? 'Deleted'
      : (STATUS_LABEL[order.status] || order.status);
    document.getElementById('quote-amount').textContent =
      (!order.deleted && order.quote_amount != null) ? `$${Number(order.quote_amount).toFixed(2)}` : '';

    document.getElementById('d-name').textContent = order.full_name;
    document.getElementById('d-type').textContent =
      order.order_type === 'custom_model' ? 'Custom Model' : 'Custom Print';
    document.getElementById('d-created').textContent = new Date(order.created_at).toLocaleString();

    if (order.notes){
      document.getElementById('d-notes').textContent = order.notes;
    } else {
      document.getElementById('d-notes-row').style.display = 'none';
    }

    if (order.file_path){
      const link = document.getElementById('d-file-link');
      link.href = publicFileUrl(order.file_path);
      link.textContent = order.file_name || 'Download file';
      document.getElementById('d-file-row').style.display = 'flex';
    }
    if (order.files && order.files.length > 1){
      // first file already shown above via file_path/file_name; list the rest
      const row = document.getElementById('d-file-row');
      row.style.display = 'flex';
      const valueCell = row.querySelector('.value');
      order.files.slice(1).forEach(f => {
        const a = document.createElement('a');
        a.href = publicFileUrl(f.path);
        a.target = '_blank';
        a.className = 'file-link';
        a.style.display = 'block';
        a.textContent = f.name;
        valueCell.appendChild(a);
      });
    }
  }

  async function loadMessages(){
    const { data, error } = await supabase.rpc('get_order_messages', { p_order_id: orderId });
    if (error) return;
    if (data.length === lastMessageCount) return; // nothing new, skip re-render
    lastMessageCount = data.length;
    renderMessages(data);
  }

  function renderMessages(list){
    if (list.length === 0){
      messagesEl.innerHTML = '<div class="msg-empty">No messages yet, say hello!</div>';
      return;
    }
    messagesEl.innerHTML = list.map(m => {
      const fileLinks = [];
      if (m.file_path) fileLinks.push({ path: m.file_path, name: m.file_name });
      (m.files || []).forEach(f => fileLinks.push(f));
      return `
      <div class="msg ${m.sender}">
        <div class="who">${m.sender === 'admin' ? 'Josh' : 'You'}</div>
        ${m.body ? `<div>${escapeHtml(m.body)}</div>` : ''}
        ${fileLinks.map(f => `<a class="file-link" target="_blank" href="${publicFileUrl(f.path)}">📎 ${escapeHtml(f.name || 'attachment')}</a>`).join('')}
      </div>
    `;
    }).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  document.getElementById('attach-input').addEventListener('change', (e) => {
    attachedFiles.push(...Array.from(e.target.files));
    e.target.value = '';
    document.getElementById('attach-label').textContent = attachedFiles.length
      ? `📎 ${attachedFiles.length} file${attachedFiles.length > 1 ? 's' : ''}` : '📎 Attach file';
  });

  function sanitizeFileName(name){
    return name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  }

  document.getElementById('send-btn').addEventListener('click', async () => {
    const bodyEl = document.getElementById('msg-body');
    const body = bodyEl.value.trim();
    if (!body && attachedFiles.length === 0) return;

    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';

    try {
      const uploaded = [];
      for (const file of attachedFiles){
        const path = `messages/${orderId}/${Date.now()}-${sanitizeFileName(file.name)}`;
        const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, file);
        if (upErr) throw upErr;
        uploaded.push({ path, name: file.name });
      }

      const { error } = await supabase.rpc('add_customer_message', {
        p_order_id: orderId,
        p_body: body || null,
        p_file_path: uploaded[0]?.path || null,
        p_file_name: uploaded[0]?.name || null,
        p_files: uploaded
      });
      if (error) throw error;

      bodyEl.value = '';
      attachedFiles = [];
      document.getElementById('attach-input').value = '';
      document.getElementById('attach-label').textContent = '📎 Attach file';
      lastMessageCount = -1; // force re-render
      loadMessages();

    } catch (err){
      alert('Could not send: ' + (err.message || 'please try again'));
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
    }
  });
</script>
</body>
</html>
