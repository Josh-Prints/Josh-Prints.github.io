      if (half * state.pxPerSec <= w) html += `<div class="rtick minor" style="left:${(half*state.pxPerSec).toFixed(1)}px"></div>`;
    }
    if (state.inPoint !== null || state.outPoint !== null){
      const a = rangeStart() * state.pxPerSec;
      const b = rangeEnd() * state.pxPerSec;
      html += `<div class="rrange" style="left:${a.toFixed(1)}px;width:${Math.max(0,b-a).toFixed(1)}px"></div>`;
      if (state.inPoint !== null) html += `<div class="rmark in" style="left:${a.toFixed(1)}px"></div>`;
      if (state.outPoint !== null) html += `<div class="rmark out" style="left:${b.toFixed(1)}px"></div>`;
    }
    state.markers.forEach(m => {
      html += `<div class="rmarker" style="left:${(m*state.pxPerSec).toFixed(1)}px" title="${tcFmt(m)}"></div>`;
    });
    tlRuler.style.width = w + 'px';
    tlRuler.innerHTML = html;
  }
  function tcShort(t){
    const m = Math.floor(t/60), s = t % 60;
    const ss = (s % 1 === 0) ? String(s).padStart(2,'0') : s.toFixed(1).padStart(4,'0');
    return `${m}:${ss}`;
  }

  function buildHeads(){
    let html = '<div class="tl-head-pad"></div>';
    state.tracks.forEach(tr => {
      html += `<div class="trk-head${tr.id === state.activeTrack ? ' active' : ''}" data-track="${tr.id}" style="height:${laneHeight(tr)}px">
        <span class="nm">${esc(tr.name)}</span>
        ${tr.kind === 'video'
          ? `<button class="tbtn-sm${tr.hidden ? ' off' : ''}" data-t-act="hide" title="Hide track">${tr.hidden ? '🚫' : '👁'}</button>`
          : ''}
        <button class="tbtn-sm${tr.muted ? ' off' : ''}" data-t-act="mute" title="Mute track">${tr.muted ? '🔇' : '🔊'}</button>
        <button class="tbtn-sm${tr.solo ? ' solo' : ''}" data-t-act="solo" title="Solo track">S</button>
        <button class="tbtn-sm${tr.locked ? ' off' : ''}" data-t-act="lock" title="Lock track">${tr.locked ? '🔒' : '🔓'}</button>
      </div>`;
    });
    tlHeads.innerHTML = html;
  }

  function buildLanes(){
    const w = timelineWidthPx();
    let html = '';
    state.tracks.forEach(tr => {
      html += `<div class="lane${tr.locked ? ' locked' : ''}" data-track="${tr.id}" style="height:${laneHeight(tr)}px;width:${w}px">`;
      tr.clips.forEach(c => {
        const left = c.start * state.pxPerSec;
        const width = Math.max(6, c.duration * state.pxPerSec);
        const cls = `clip ${c.type}${isSel(c.id) ? ' sel' : ''}${c.enabled === false ? ' off' : ''}${c.groupId ? ' grouped' : ''}`;
        const fi = c.fadeIn > 0 ? `<div class="fadeMark" style="width:${(c.fadeIn*state.pxPerSec).toFixed(1)}px"></div>` : '';
        const fo = c.fadeOut > 0 ? `<div class="fadeMark out" style="right:0;width:${(c.fadeOut*state.pxPerSec).toFixed(1)}px"></div>` : '';
        const wf = (c.type === 'audio' || c.type === 'video') ? `<canvas class="wf" data-wf="${c.id}"></canvas>` : '';
        const kts = keyframeTimes(c);
        const kstrip = kts.length
          ? `<div class="kfstrip">` + kts.map(t =>
              `<div class="kfd" style="left:${(t*state.pxPerSec).toFixed(1)}px"></div>`).join('') + `</div>`
          : '';
        const lblStyle = c.label ? `;--c1:${c.label};--c2:${c.label}` : '';
        const grouped = c.groupId ? ' grouped' : '';
        html += `<div class="${cls}" data-clip="${c.id}" style="left:${left.toFixed(1)}px;width:${width.toFixed(1)}px${lblStyle}">
          ${wf}${fi}${fo}${kstrip}
          <div class="lbl">${esc(clipLabel(c))}</div>
          <div class="hnd l" data-handle="l"></div>
          <div class="hnd r" data-handle="r"></div>
        </div>`;
      });
      html += '</div>';
    });
    tlLanes.innerHTML = html;
    drawWaveforms();
  }
  function clipLabel(c){
    if (c.type === 'text') return '🅣 ' + (c.text || 'Text').slice(0, 40);
    if (c.type === 'outro') return '✦ Logo outro';
    if (c.type === 'shape') return '◼ ' + c.name;
    if (c.type === 'adjust') return '◐ Adjustment';
    return c.name;
  }

  function drawWaveforms(){
    tlLanes.querySelectorAll('canvas[data-wf]').forEach(cv => {
      const clip = findClip(cv.dataset.wf);
      if (!clip) return;
      const a = assets.get(clip.assetId);
      const host = cv.parentElement;
      const w = Math.max(1, Math.round(host.clientWidth)), h = Math.max(1, Math.round(host.clientHeight * 0.6));
      cv.width = w; cv.height = h;
      const c2 = cv.getContext('2d');
      c2.clearRect(0,0,w,h);
      if (!a || !a.peaks || !a.duration) return;
      c2.fillStyle = 'rgba(255,255,255,0.75)';
      const peaks = a.peaks;
      for (let x = 0; x < w; x++){
        const tSrc = clip.inPoint + (x / state.pxPerSec) * clip.speed;
        const idx = Math.floor((tSrc / a.duration) * peaks.length);
        if (idx < 0 || idx >= peaks.length) continue;
        const v = peaks[idx];
        const bh = Math.max(1, v * h);
        c2.fillRect(x, (h - bh)/2, 1, bh);
      }
    });
  }

  function rebuild(){
    if (state.playhead > totalDuration()) state.playhead = totalDuration();
    buildRuler(); buildHeads(); buildLanes();
    updatePlayheadUI();
    updateKfBtn();
    renderInspector();
    renderBin();
    $('tlHint').textContent = state.selected
      ? `${clipLabel(selectedClip() || {name:''})} · ${(selectedClip()?.duration || 0).toFixed(2)}s`
      : 'no clip selected';
    $('exportBtn').disabled = totalDuration() <= 0;
    renderAt(state.playhead);
  }

  /* ---------- timeline interactions ---------- */
  function timeFromEvent(e){
    const r = tlInner.getBoundingClientRect();
    return Math.max(0, (e.clientX - r.left) / state.pxPerSec);
  }
  function snapTime(t, ignoreId){
    if (!state.snap) return t;
    const tol = 9 / state.pxPerSec;
    const cands = [0, state.playhead].concat(state.markers);
    if (state.inPoint !== null) cands.push(state.inPoint);
    if (state.outPoint !== null) cands.push(state.outPoint);
    for (const tr of state.tracks) for (const c of tr.clips){
      if (c.id === ignoreId) continue;
      cands.push(c.start, c.start + c.duration);
    }
    let best = t, bd = tol;
    for (const cand of cands){
      const d = Math.abs(cand - t);
      if (d < bd){ bd = d; best = cand; }
    }
    return best;
  }

  let scrubbing = false;
  tlRuler.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    scrubbing = true;
    try { tlRuler.setPointerCapture(e.pointerId); } catch(err){}
    if (playing) stopPlayback();
    setPlayhead(timeFromEvent(e));
  });
  tlRuler.addEventListener('pointermove', e => { if (scrubbing) setPlayhead(timeFromEvent(e)); });
  tlRuler.addEventListener('pointerup', e => {
    scrubbing = false;
    try { tlRuler.releasePointerCapture(e.pointerId); } catch(err){}
  });

  let drag = null;
  tlLanes.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const clipEl = e.target.closest('.clip');
    if (!clipEl){
      const lane = e.target.closest('.lane');
      if (lane){ state.activeTrack = lane.dataset.track; setSel([]); rebuild(); }
      return;
    }
    const clip = findClip(clipEl.dataset.clip);
    if (!clip) return;
    const track = trackOfClip(clip.id);
    if (track.locked){ toast('Track is locked'); return; }

    // a grouped clip brings its whole group along
    const groupIds = clip.groupId
      ? allClips().filter(x => x.groupId === clip.groupId).map(x => x.id)
      : [clip.id];
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    // clicking a clip that's already part of a multi-selection keeps the group so it can be
    // dragged as one; if the click turns out to be a plain click, endDrag collapses it
    const collapseOnClick = !additive && isSel(clip.id) && state.sel.length > 1 && !clip.groupId;
    if (additive) groupIds.forEach(id => { if (!isSel(id)) setSel(state.sel.concat([id]), clip.id); });
    else if (!isSel(clip.id)) setSel(groupIds, clip.id);
    else state.selected = clip.id;
    state.activeTrack = track.id;

    if (state.tool === 'blade'){
      const t = timeFromEvent(e);
      splitClipAt(clip, t);
      return;
    }

    const handle = e.target.dataset.handle || null;
    if (playing) stopPlayback();
    // dragging the body moves every selected clip together; trimming only touches this one
    const group = handle ? [clip] : selClips().filter(c => !(trackOfClip(c.id) || {}).locked);
    drag = {
      id: clip.id, handle, moved: false,
      startX: e.clientX, startY: e.clientY,
      origStart: clip.start, origDur: clip.duration, origIn: clip.inPoint,
      origTrack: track.id, pushed: false, collapseOnClick,
      ripple: !!(handle && e.altKey),
      after: (handle ? track.clips.filter(x => x.id !== clip.id && x.start >= clip.start + clip.duration - 0.001)
                              .map(x => ({ id: x.id, start: x.start })) : []),
      group: group.map(c => ({ id: c.id, start: c.start }))
    };
    clipEl.classList.add('dragging');
    try { clipEl.setPointerCapture(e.pointerId); } catch(err){}
    rebuildSelectionOnly();
  });

  function rebuildSelectionOnly(){
    tlLanes.querySelectorAll('.clip').forEach(el => el.classList.toggle('sel', isSel(el.dataset.clip)));
    tlHeads.querySelectorAll('.trk-head').forEach(el => el.classList.toggle('active', el.dataset.track === state.activeTrack));
    renderInspector();
    $('tlHint').textContent = state.selected
      ? `${clipLabel(selectedClip() || {name:''})} · ${(selectedClip()?.duration || 0).toFixed(2)}s`
      : 'no clip selected';
  }

  tlLanes.addEventListener('pointermove', e => {
    if (!drag) return;
    const clip = findClip(drag.id);
    if (!clip) return;
    const dx = (e.clientX - drag.startX) / state.pxPerSec;
    if (!drag.moved && Math.abs(e.clientX - drag.startX) < 3 && Math.abs(e.clientY - drag.startY) < 3) return;
    if (!drag.moved){ drag.moved = true; if (!drag.pushed){ pushUndo(); drag.pushed = true; } }

    const a = assets.get(clip.assetId);
    const srcLen = (clip.type === 'video' || clip.type === 'audio') ? (a ? a.duration : 0) : 0;

    if (drag.handle === 'l'){
      let newStart = snapTime(drag.origStart + dx, clip.id);
      newStart = clamp(newStart, 0, drag.origStart + drag.origDur - 0.1);
      const delta = newStart - drag.origStart;
      let newIn = drag.origIn + delta * clip.speed;
      if (srcLen && newIn < 0){ newIn = 0; newStart = drag.origStart - drag.origIn / clip.speed; }
      clip.start = newStart;
      clip.duration = drag.origStart + drag.origDur - newStart;
      if (srcLen) clip.inPoint = Math.max(0, newIn);
    } else if (drag.handle === 'r'){
      let end = snapTime(drag.origStart + drag.origDur + dx, clip.id);
      let dur = Math.max(0.1, end - clip.start);
      if (srcLen){
        const maxDur = Math.max(0.1, (srcLen - clip.inPoint) / clip.speed);
        dur = Math.min(dur, maxDur);
      }
      clip.duration = dur;
      if (drag.ripple){
        const shift = (clip.start + clip.duration) - (drag.origStart + drag.origDur);
        drag.after.forEach(a => {
          const ac = findClip(a.id);
          if (ac) ac.start = Math.max(0, a.start + shift);
        });
      }
    } else {
      const newStart = Math.max(0, snapTime(drag.origStart + dx, clip.id));
      const shift = newStart - drag.origStart;
      // move the whole selection by the same amount, never past zero
      let applied = shift;
      drag.group.forEach(g => { applied = Math.max(applied, -g.start); });
      drag.group.forEach(g => {
        const gc = findClip(g.id);
        if (gc) gc.start = Math.max(0, g.start + applied);
      });
      if (!drag.group.length) clip.start = newStart;
      // vertical track change (primary clip only)
      const lane = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains('lane'));
      if (drag.group.length <= 1 && lane && lane.dataset.track !== trackOfClip(clip.id).id){
        const target = state.tracks.find(t => t.id === lane.dataset.track);
        const kindOK = target && !target.locked &&
          ((clip.type === 'audio' && target.kind === 'audio') || (clip.type !== 'audio' && target.kind === 'video'));
        if (kindOK){
          const from = trackOfClip(clip.id);
          from.clips = from.clips.filter(c => c.id !== clip.id);
          target.clips.push(clip);
          state.activeTrack = target.id;
        }
      }
    }
    buildRuler(); buildLanes(); rebuildSelectionOnly();
    renderAt(state.playhead);
  });

  function endDrag(e){
    if (!drag) return;
    const el = tlLanes.querySelector(`.clip[data-clip="${drag.id}"]`);
    if (el) el.classList.remove('dragging');
    const wasClick = !drag.moved && drag.collapseOnClick;
    const id = drag.id;
    drag = null;
    if (wasClick) setSel([id]);
    rebuild();
  }
  tlLanes.addEventListener('pointerup', endDrag);
  tlLanes.addEventListener('pointercancel', endDrag);

  tlHeads.addEventListener('dblclick', e => {
    const nm = e.target.closest('.nm');
    if (!nm) return;
    const head = e.target.closest('.trk-head');
    const tr = state.tracks.find(t => t.id === head.dataset.track);
    if (!tr) return;
    const name = prompt('Track name', tr.name);
    if (name === null) return;
    pushUndo();
    tr.name = name.trim() || tr.name;
    rebuild();
  });
  tlHeads.addEventListener('click', e => {
    const head = e.target.closest('.trk-head');
    if (!head) return;
    const tr = state.tracks.find(t => t.id === head.dataset.track);
    if (!tr) return;
    const act = e.target.dataset.tAct;
    if (act){
      pushUndo();
      if (act === 'hide') tr.hidden = !tr.hidden;
      if (act === 'mute') tr.muted = !tr.muted;
      if (act === 'solo') tr.solo = !tr.solo;
      if (act === 'lock') tr.locked = !tr.locked;
      state.activeTrack = tr.id;
      rebuild();
      return;
    }
    // plain click only re-marks the active track: rebuilding here would replace the
    // header node between the two clicks of a double-click and kill rename
    const changed = state.activeTrack !== tr.id;
    state.activeTrack = tr.id;
    if (changed){
      tlHeads.querySelectorAll('.trk-head').forEach(el =>
        el.classList.toggle('active', el.dataset.track === tr.id));
    }
  });

  /* ---------- clip commands ---------- */
  function splitClipAt(clip, t){
    if (t <= clip.start + 0.05 || t >= clip.start + clip.duration - 0.05) return toast('Playhead is not over this clip');
    pushUndo();
    const track = trackOfClip(clip.id);
    const right = cloneClip(clip, {
      id: uid('c'),
      start: t,
      duration: clip.start + clip.duration - t,
      inPoint: clip.inPoint + (t - clip.start) * clip.speed,
      tinType: 'none'
    });
    clip.duration = t - clip.start;
    clip.toutType = 'none';
    track.clips.push(right);
    ensureRuntime(right);
    setSel([right.id]);
    rebuild();
    toast('Split');
  }
  function cmdSplit(){
    const c = selectedClip();
    if (!c) return toast('Select a clip first');
    splitClipAt(c, state.playhead);
  }
  // blade every unlocked track at the playhead, like Premiere's add-edit
  function cmdSplitAll(){
    const t = state.playhead;
    const hits = [];
    state.tracks.forEach(tr => {
      if (tr.locked) return;
      tr.clips.slice().forEach(c => {
        if (t > c.start + 0.05 && t < c.start + c.duration - 0.05) hits.push(c);
      });
    });
    if (!hits.length) return toast('Nothing under the playhead');
    pushUndo();
    hits.forEach(c => {
      const track = trackOfClip(c.id);
      const right = cloneClip(c, {
        id: uid('c'), start: t,
        duration: c.start + c.duration - t,
        inPoint: c.inPoint + (t - c.start) * c.speed,
        tinType: 'none'
      });
      c.duration = t - c.start;
      c.toutType = 'none';
      track.clips.push(right);
      ensureRuntime(right);
    });
    rebuild();
    toast(`Split ${hits.length} clip${hits.length > 1 ? 's' : ''}`);
  }
  function cmdDelete(ripple){
    const clips = selClips();
    if (!clips.length) return toast('Select a clip first');
    const movable = clips.filter(c => !(trackOfClip(c.id) || {}).locked);
    if (!movable.length) return toast('Track is locked');
    pushUndo();
    movable.forEach(c => {
      const track = trackOfClip(c.id);
      const gap = c.duration, from = c.start;
      track.clips = track.clips.filter(x => x.id !== c.id);
      if (ripple) track.clips.forEach(x => { if (x.start >= from) x.start = Math.max(0, x.start - gap); });
    });
    setSel([]);
    pruneRuntime();
    rebuild();
    toast(`${ripple ? 'Ripple deleted' : 'Deleted'} ${movable.length} clip${movable.length > 1 ? 's' : ''}`);
  }
  function cmdDuplicate(){
    const clips = selClips();
    if (!clips.length) return toast('Select a clip first');
    pushUndo();
    const made = [];
    clips.forEach(c => {
      const track = trackOfClip(c.id);
      const copy = cloneClip(c, { id: uid('c'), start: c.start + c.duration });
      track.clips.push(copy);
      ensureRuntime(copy);
      made.push(copy.id);
    });
    setSel(made);
    rebuild();
    toast('Duplicated');
  }

  /* ---------- motion presets: write keyframes across the clip ---------- */
  function applyMotionPreset(c, kind){
    const d = c.duration;
    if (!c.kf) c.kf = {};
    const set = (key, points) => {
      c.kf[key] = points.map(p => ({ t: clamp(p[0], 0, d), v: p[1], ez: p[2] || 'smooth' }))
                        .sort((a,b) => a.t - b.t);
    };
    const s0 = c.scale || 1;
    if (kind === 'kenburnsIn')       set('scale', [[0, s0], [d, s0 * 1.25]]);
    else if (kind === 'kenburnsOut') set('scale', [[0, s0 * 1.25], [d, s0]]);
    else if (kind === 'fade'){
      const f = Math.min(0.6, d/3);
      set('opacity', [[0, 0], [f, 1], [Math.max(f, d - f), 1], [d, 0]]);
    }
    else if (kind === 'slideIn'){
      const f = Math.min(0.6, d/2);
      set('x', [[0, -state.width * 0.6], [f, c.x || 0]]);
    }
    else if (kind === 'popIn'){
      const f = Math.min(0.45, d/2);
      set('scale', [[0, s0 * 0.4], [f * 0.7, s0 * 1.08], [f, s0]]);
      set('opacity', [[0, 0], [f * 0.6, 1]]);
    }
    else if (kind === 'shake'){
      const pts = [], n = Math.max(4, Math.round(d * 8));
      for (let i = 0; i <= n; i++){
        pts.push([ (i/n) * d, (c.x || 0) + (i === 0 || i === n ? 0 : (i % 2 ? 1 : -1) * state.width * 0.012), 'linear' ]);
      }
      set('x', pts);
    }
    renderInspector(); buildLanes(); renderAt(state.playhead); updateKfBtn();
  }

  /* ---------- grouping ---------- */
  function cmdGroup(){
    const clips = selClips();
    if (clips.length < 2) return toast('Select at least two clips');
    pushUndo();
    const gid = uid('g');
    clips.forEach(c => { c.groupId = gid; });
    rebuild();
    toast(`Grouped ${clips.length} clips`);
  }
  function cmdUngroup(){
    const clips = selClips().filter(c => c.groupId);
    if (!clips.length) return toast('No group selected');
    pushUndo();
    const ids = new Set(clips.map(c => c.groupId));
    allClips().forEach(c => { if (ids.has(c.groupId)) delete c.groupId; });
    rebuild();
    toast('Ungrouped');
  }

  /* ---------- audio helpers ---------- */
  function cmdNormalize(){
    const clips = selClips().filter(c => c.type === 'audio' || c.type === 'video');
    if (!clips.length) return toast('Select an audio or video clip');
    pushUndo();
    let done = 0;
    clips.forEach(c => {
      const a = assets.get(c.assetId);
      if (!a || !a.peaks || !a.duration) return;
      const from = Math.floor((c.inPoint / a.duration) * a.peaks.length);
      const to = Math.ceil(((c.inPoint + c.duration * c.speed) / a.duration) * a.peaks.length);
      let peak = 0;
      for (let i = Math.max(0, from); i < Math.min(a.peaks.length, to); i++)
        if (a.peaks[i] > peak) peak = a.peaks[i];
      if (peak > 0.001){ c.volume = clamp(0.89 / peak, 0.1, 2); done++; }
    });
    rebuild();
    toast(done ? `Normalised ${done} clip${done>1?'s':''}` : 'No decodable audio in the selection');
  }
  // dip the selected music clip wherever another track has sound
  function cmdDuck(){
    const music = selectedClip();
    if (!music || (music.type !== 'audio' && music.type !== 'video'))
      return toast('Select the music clip first');
    const musicTrack = trackOfClip(music.id);
    const others = state.tracks
      .filter(tr => tr.id !== musicTrack.id)
      .flatMap(tr => tr.clips)
      .filter(c => (c.type === 'audio' || c.type === 'video') && c.enabled !== false && !c.muted);
    if (!others.length) return toast('Nothing on other tracks to duck under');
    pushUndo();
    const base = music.volume || 1, low = base * 0.25, ramp = 0.35;
    const pts = [{ t: 0, v: base, ez: 'smooth' }];
    others
      .map(c => [Math.max(music.start, c.start), Math.min(music.start + music.duration, c.start + c.duration)])
      .filter(([a,b]) => b > a)
      .sort((p,q) => p[0] - q[0])
      .forEach(([a,b]) => {
        const s0 = a - music.start, s1 = b - music.start;
        pts.push({ t: Math.max(0, s0 - ramp), v: base, ez:'smooth' });
        pts.push({ t: s0, v: low, ez:'smooth' });
        pts.push({ t: s1, v: low, ez:'smooth' });
        pts.push({ t: Math.min(music.duration, s1 + ramp), v: base, ez:'smooth' });
      });
    pts.push({ t: music.duration, v: base, ez:'smooth' });
    if (!music.kf) music.kf = {};
    music.kf.volume = pts
      .filter(p => p.t >= 0 && p.t <= music.duration)
      .sort((a,b) => a.t - b.t);
    rebuild();
    toast('Ducked under ' + others.length + ' clip(s)');
  }
  function cmdQuickFade(){
    const clips = selClips();
    if (!clips.length) return toast('Select a clip first');
    pushUndo();
    clips.forEach(c => {
      const f = Math.min(0.5, c.duration / 4);
      if (c.type === 'audio' || c.type === 'video'){ c.fadeIn = f; c.fadeOut = f; }
      if (c.type !== 'audio'){ c.tinType = 'fade'; c.tinDur = f; c.toutType = 'fade'; c.toutDur = f; }
    });
    rebuild();
    toast('Fades added');
  }

  /* ---------- freeze frame: snapshot a video clip into a still ---------- */
  function cmdFreezeFrame(){
    const c = selectedClip();
    if (!c || c.type !== 'video') return toast('Select a video clip first');
    if (state.playhead < c.start || state.playhead > c.start + c.duration)
      return toast('Move the playhead over the clip');
    const rt = runtime.get(c.id);
    if (!rt || rt.el.readyState < 2) return toast('That frame is not ready yet');
    const cv = document.createElement('canvas');
    cv.width = rt.el.videoWidth; cv.height = rt.el.videoHeight;
    cv.getContext('2d').drawImage(rt.el, 0, 0);
    cv.toBlob(blob => {
      if (!blob) return toast('Could not freeze that frame');
      const a = { id: uid('a'), name: 'Freeze — ' + c.name, kind:'image', file: blob,
                  url: URL.createObjectURL(blob), duration:0, width: cv.width, height: cv.height, peaks:null };
      assets.set(a.id, a);
      const img = new Image();
      img.onload = () => { a.el = img; renderBin(); if (!playing) renderAt(state.playhead); };
      img.src = a.url;
      pushUndo();
      const track = trackOfClip(c.id);
      const still = makeClip('image', { assetId:a.id, name:a.name, start: state.playhead, duration: 2 });
      // push the rest of the track along so the freeze slots in
      track.clips.forEach(x => { if (x.id !== c.id && x.start >= state.playhead) x.start += 2; });
      track.clips.push(still);
      setSel([still.id]);
      rebuild();
      toast('Freeze frame added');
    }, 'image/png');
  }

  /* ---------- gaps ---------- */
  function cmdCloseGaps(){
    const tr = state.tracks.find(t => t.id === state.activeTrack);
    if (!tr || tr.locked) return toast('Pick an unlocked track first');
    const ordered = tr.clips.slice().sort((a,b) => a.start - b.start);
    if (!ordered.length) return toast('That track is empty');
    pushUndo();
    let cursor = 0;
    ordered.forEach(c => { c.start = cursor; cursor += c.duration; });
    rebuild();
    toast('Gaps closed on ' + tr.name);
  }

  /* ---------- clipboard ---------- */
  let clipboard = [];
  function cmdCopy(cut){
    const clips = selClips();
    if (!clips.length) return toast('Select a clip first');
    const base = Math.min(...clips.map(c => c.start));
    clipboard = clips.map(c => ({
      data: cloneClip(c, {}), offset: c.start - base,
      trackIdx: state.tracks.findIndex(t => t.id === (trackOfClip(c.id) || {}).id)
    }));
    toast(`${cut ? 'Cut' : 'Copied'} ${clips.length} clip${clips.length > 1 ? 's' : ''}`);
    if (cut) cmdDelete(false);
  }
  function cmdPaste(){
    if (!clipboard.length) return toast('Clipboard is empty');
    pushUndo();
    const made = [];
    clipboard.forEach(entry => {
      const track = state.tracks[entry.trackIdx] && !state.tracks[entry.trackIdx].locked
        ? state.tracks[entry.trackIdx]
        : state.tracks.find(t => t.kind === (entry.data.type === 'audio' ? 'audio' : 'video') && !t.locked);
      if (!track) return;
      const copy = cloneClip(entry.data, { id: uid('c'), start: state.playhead + entry.offset });
      track.clips.push(copy);
      ensureRuntime(copy);
      made.push(copy.id);
    });
    setSel(made);
    rebuild();
    toast('Pasted');
  }
  function cmdSelectAll(){
    const ids = state.tracks.filter(t => !t.locked).flatMap(t => t.clips.map(c => c.id));
    if (!ids.length) return;
    setSel(ids);
    rebuild();
    toast(`Selected ${ids.length} clips`);
  }
  function cmdToggleEnabled(){
    const clips = selClips();
    if (!clips.length) return toast('Select a clip first');
    pushUndo();
    const turningOff = clips[0].enabled !== false;
    clips.forEach(c => { c.enabled = !turningOff; });
    rebuild();
    toast(turningOff ? 'Clip disabled' : 'Clip enabled');
  }
  function cmdNudge(dir){
    const clips = selClips().filter(c => !(trackOfClip(c.id) || {}).locked);
    if (!clips.length) return;
    pushUndo();
    const step = dir / state.fps;
    let d = step;
    clips.forEach(c => { d = Math.max(d, -c.start); });
    clips.forEach(c => { c.start = Math.max(0, c.start + d); });
    rebuild();
  }

  /* ---------- markers & in/out range ---------- */
  function addMarker(){
    const t = Math.round(state.playhead * 1000) / 1000;
    if (state.markers.some(m => Math.abs(m - t) < 0.02)){
      state.markers = state.markers.filter(m => Math.abs(m - t) >= 0.02);
      buildRuler(); return toast('Marker removed');
    }
    pushUndo();
    state.markers = state.markers.concat([t]).sort((a,b) => a-b);
    buildRuler();
    toast('Marker at ' + tcFmt(t));
  }
  function gotoMarker(dir){
    const ms = state.markers.slice().sort((a,b) => a-b);
    if (!ms.length) return toast('No markers');
    const next = dir > 0 ? ms.find(m => m > state.playhead + 0.01)
                         : ms.slice().reverse().find(m => m < state.playhead - 0.01);
    if (next === undefined) return toast(dir > 0 ? 'No later marker' : 'No earlier marker');
    stopPlayback(); setPlayhead(next);
  }
  function clearMarkers(){
    if (!state.markers.length) return toast('No markers');
    pushUndo();
    state.markers = [];
    buildRuler(); toast('Markers cleared');
  }
  function setIn(){ state.inPoint = state.playhead;
    if (state.outPoint !== null && state.outPoint <= state.inPoint) state.outPoint = null;
    buildRuler(); toast('In point ' + tcFmt(state.playhead)); }
  function setOut(){ state.outPoint = state.playhead;
    if (state.inPoint !== null && state.inPoint >= state.outPoint) state.inPoint = null;
    buildRuler(); toast('Out point ' + tcFmt(state.playhead)); }
  function clearInOut(){ state.inPoint = state.outPoint = null; buildRuler(); toast('Range cleared'); }
  function rangeStart(){ return state.inPoint !== null ? state.inPoint : 0; }
  function rangeEnd(){ return state.outPoint !== null ? state.outPoint : totalDuration(); }
  function hasRange(){ return state.inPoint !== null || state.outPoint !== null; }

  /* ---------- context menu ---------- */
  const ctxMenu = document.createElement('div');
  ctxMenu.className = 'ctx-menu';
  document.body.appendChild(ctxMenu);
  let ctxAsset = null;   // bin item the menu was opened on

  const CTX_CLIP = [

  const CTX_LANE = [

    ['New adjustment layer', 'addAdjust'], ['-'],
    ['Import media…', 'import', 'I'], ['Select all', 'selectAll', 'Ctrl A'], ['-'],
    ['Close gaps on track', 'closeGaps']
  ];
  const CTX_CANVAS = [
    ['New text clip', 'addText', 'T'], ['New rectangle', 'addRect'],
    ['New ellipse', 'addEllipse'], ['New adjustment layer', 'addAdjust'], ['-'],
    ['Paste at playhead', 'paste', 'Ctrl V'], ['-'],
    ['Export current frame (PNG)', 'snapshot']
  ];
  const CTX_BIN_ITEM = [
    ['Add to timeline', 'binAdd'], ['-'], ['Remove from project', 'binRemove']
  ];
  const CTX_BIN = [['Import media…', 'import', 'I'], ['-'], ['Remove unused media', 'purgeUnused']];

  function openCtx(x, y, items){
    ctxMenu.innerHTML = items.map(it =>
      it[0] === '-' ? '<div class="ctx-sep"></div>'
        : `<button data-cmd="${it[1]}">${esc(it[0])}${it[2] ? `<kbd>${esc(it[2])}</kbd>` : ''}</button>`).join('');
    // show first so it can be measured, then keep it inside the window
    ctxMenu.style.left = '0px';
    ctxMenu.style.top = '0px';
    ctxMenu.classList.add('on');
    const r = ctxMenu.getBoundingClientRect();
    ctxMenu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 6)) + 'px';
    ctxMenu.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 6)) + 'px';
  }
  const closeCtx = () => ctxMenu.classList.remove('on');

  // right-clicking a clip works on that clip, so pull it into the selection first
  function ctxSelect(id){
    if (!isSel(id)){
      const c = findClip(id);
      const ids = c && c.groupId
        ? allClips().filter(x => x.groupId === c.groupId).map(x => x.id)
        : [id];
      setSel(ids, id);
    } else {
      state.selected = id;
    }
    const tr = trackOfClip(id);
    if (tr) state.activeTrack = tr.id;
    rebuildSelectionOnly();
  }

  function ctxItemsFor(e){
    const t = e.target;
    if (t.closest('input, textarea, select, [contenteditable="true"]')) return null;

    const binItem = t.closest('#binList [data-asset]');
    if (binItem){ ctxAsset = binItem.dataset.asset; return CTX_BIN_ITEM; }
    if (t.closest('#binList')) return CTX_BIN;

    const head = t.closest('.trk-head');
    if (head){
      state.activeTrack = head.dataset.track;
      rebuildSelectionOnly();
      return CTX_TRACK;
    }

    if (t.closest('#tlRuler')) return CTX_RULER;

    const clipEl = t.closest('.clip');
    if (clipEl){ ctxSelect(clipEl.dataset.clip); return CTX_CLIP; }

    if (t.closest('.mon-stage')){
      const p = toCanvasPt(e);
      const hit = clipAtPoint(p.x, p.y);
      if (hit){ ctxSelect(hit.id); return CTX_CLIP; }
      return CTX_CANVAS;
    }

    const lane = t.closest('.lane');
    if (lane){
      state.activeTrack = lane.dataset.track;
      rebuildSelectionOnly();
      return CTX_LANE;
    }
    return null;
  }

  document.addEventListener('contextmenu', e => {
    if (e.shiftKey) return;            // shift+right-click falls through to the browser menu
    const items = ctxItemsFor(e);
    if (!items) return;
    e.preventDefault();
    openCtx(e.clientX, e.clientY, items);
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.ctx-menu')) closeCtx(); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtx(); }, true);
  window.addEventListener('blur', closeCtx);
  ctxMenu.addEventListener('click', () => closeCtx());

  /* ================= INSPECTOR ================= */
  const FMT = {
    scale: v => Math.round(v*100)+'%', opacity: v => Math.round(v*100)+'%',
    volume: v => Math.round(v*100)+'%', speed: v => (+v).toFixed(2)+'×',
    rotation: v => Math.round(v)+'°', hue: v => Math.round(v)+'°', blurPx: v => (+v)+'px',
    brightness: v => (+v).toFixed(2), contrast: v => (+v).toFixed(2), saturation: v => (+v).toFixed(2),
    cropL: v => Math.round(v*100)+'%', cropR: v => Math.round(v*100)+'%',
    cropT: v => Math.round(v*100)+'%', cropB: v => Math.round(v*100)+'%',
    pan: v => Math.abs(+v) < 0.02 ? 'centre' : ((+v < 0 ? 'L' : 'R') + Math.round(Math.abs(+v)*100)),
    eqLow: v => (+v > 0 ? '+' : '') + (+v).toFixed(1) + ' dB',
    eqMid: v => (+v > 0 ? '+' : '') + (+v).toFixed(1) + ' dB',
    eqHigh: v => (+v > 0 ? '+' : '') + (+v).toFixed(1) + ' dB',
    keySim: v => (+v).toFixed(2), keySoft: v => (+v).toFixed(3),
    keySpill: v => Math.round(v*100)+'%', vignette: v => Math.round(v*100)+'%',
    tintAmt: v => Math.round(v*100)+'%', shapeW: v => Math.round(v*100)+'%',
    shapeH: v => Math.round(v*100)+'%', radius: v => Math.round(v*100)+'%',
    maskW: v => Math.round(v*100)+'%', maskH: v => Math.round(v*100)+'%',
    maskFeather: v => Math.round(v*100)+'%', pixelate: v => Math.round(v*100)+'%',
    grain: v => Math.round(v*100)+'%', rgbSplit: v => Math.round(v*100)+'%',
    gradAngle: v => Math.round(v)+'°',
    invert: v => Math.round(v*100)+'%', sepia: v => Math.round(v*100)+'%',
    gray: v => Math.round(v*100)+'%', glitch: v => Math.round(v*100)+'%',
    scanlines: v => Math.round(v*100)+'%', bloom: v => Math.round(v*100)+'%',
    zoomBlur: v => Math.round(v*100)+'%', cornerR: v => Math.round(v*100)+'%',
    threshold: v => (+v) > 0 ? Math.round(v*100)+'%' : 'off'
  };
  const fmtVal = (key, v) => FMT[key] ? FMT[key](v) : (Math.round(v*100)/100);
  const kfBtn = key => ANIM_KEYS.includes(key)
    ? `<button class="kf${isAnimated(selectedClip(), key) ? ' on' : ''}" data-kf="${key}" title="Animate with keyframes">◆</button>`
    : '';

  function fRange(label, key, min, max, step, fmt){
    const c = selectedClip(), v = curVal(c, key);
    return `<div class="fld"><label>${label}</label><div class="ctl">
      <input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${v}">
      <span class="num-out" data-out="${key}">${fmt ? fmt(v) : fmtVal(key, v)}</span>${kfBtn(key)}</div></div>`;
  }
  function fNum(label, key, min, max, step){
    const c = selectedClip(), v = curVal(c, key);
    return `<div class="fld"><label>${label}</label><div class="ctl">
      <input type="number" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${v}">${kfBtn(key)}</div></div>`;
  }
  function fSel(label, key, opts){
    const c = selectedClip();
    return `<div class="fld"><label>${label}</label><div class="ctl"><select data-k="${key}">` +
      opts.map(o => {
        const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
        return `<option value="${v}"${c[key] === v ? ' selected' : ''}>${t}</option>`;
      }).join('') + `</select></div></div>`;
  }
  function fColor(label, key){
    const c = selectedClip();
    return `<div class="fld"><label>${label}</label><div class="ctl">
      <input type="color" data-k="${key}" value="${c[key]}"></div></div>`;
  }
  function fCheck(label, key){
    const c = selectedClip();
    return `<div class="fld"><label>${label}</label><div class="ctl">
      <input type="checkbox" data-k="${key}"${c[key] ? ' checked' : ''}></div></div>`;
  }
  function fTextArea(label, key){
    const c = selectedClip();
    return `<div class="fld" style="align-items:flex-start"><label style="padding-top:4px">${label}</label>
      <div class="ctl"><textarea data-k="${key}">${esc(c[key])}</textarea></div></div>`;

  const sect = (title, body) => `<div class="sect"><div class="sect-h">${title}</div>${body}</div>`;

  function renderInspector(){

      return;
    }
    const badgeColor = { video:'var(--v-clip2)', image:'var(--v-clip2)', audio:'var(--a-clip2)',

    let h = `<div class="clip-badge" style="background:${badgeColor}">${c.type}</div>`;
    const srcA = assets.get(c.assetId);
    if (srcA){
      const src = sourceSize(c);
      h += `<div class="src-info">
              <div>${esc(srcA.name)}</div>

            </div>`;
    }

    h += sect('Label',
      `<div class="preset-row">` +
      ['', '#4493f8', '#3fb950', '#e3b341', '#f85149', '#a371f7'].map(col =>
        `<button class="preset lbl-swatch${(c.label||'') === col ? ' on' : ''}" data-label="${col}"
           style="${col ? `background:${col};border-color:${col}` : ''}">${col ? '' : '✕'}</button>`).join('') +
      `</div>`
    );

    h += sect('Timing',
      fNum('Start (s)','start',0,99999,0.05) +
      fNum('Duration','duration',0.1,99999,0.05) +
      ((c.type === 'video' || c.type === 'audio')
        ? fNum('In point','inPoint',0,99999,0.05) +
          fRange('Speed','speed',0.25,4,0.05, v => (+v).toFixed(2)+'×') +
          fCheck('Keep pitch','keepPitch')
        : '')
    );

    if (c.type === 'adjust'){
      h += `<div style="font-size:11px;color:var(--dim2);line-height:1.55;margin:-2px 0 12px">

            </div>`;
      h += sect('Strength', fRange('Amount','opacity',0,1,0.01, v => Math.round(v*100)+'%'));
      const presetBtns = Object.keys(LOOKS).map(k =>
        `<button class="preset${c.look === k ? ' on' : ''}" data-look="${k}">${k}</button>`).join('');
      h += sect('Colour',
        `<div class="preset-row">${presetBtns}</div>` +
        fRange('Brightness','brightness',0.2,2,0.01, v => (+v).toFixed(2)) +
        fRange('Contrast','contrast',0.2,2,0.01, v => (+v).toFixed(2)) +
        fRange('Saturation','saturation',0,3,0.01, v => (+v).toFixed(2)) +
        fRange('Hue','hue',-180,180,1, v => Math.round(v)+'°') +
        fRange('Blur','blurPx',0,30,0.5, v => (+v)+'px')
      );
      h += sect('Effects',
        fRange('Vignette','vignette',0,1,0.01, v => Math.round(v*100)+'%') +
        fCheck('Tint','tintOn') + fColor('Tint colour','tintColor') +
        fRange('Tint amount','tintAmt',0,1,0.01, v => Math.round(v*100)+'%')
      );
    } else if (c.type !== 'audio'){
      h += `<div style="font-size:11px;color:var(--dim2);line-height:1.5;margin:-2px 0 12px">
              Click <span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
              border-radius:4px;background:#2b303a;border:1px solid #4a5261;color:#c6cedb;font-size:9px;
              vertical-align:middle">◆</span> beside a value to animate it with keyframes.
            </div>`;
      h += sect('Fit &amp; align',
        `<div class="preset-row">
           <button class="preset" data-fit="fit">Fit</button>
           <button class="preset" data-fit="fill">Fill</button>
           <button class="preset" data-fit="reset">Reset</button>
         </div>
         <div class="preset-row">
           <button class="preset" data-align="left">⇤</button>
           <button class="preset" data-align="centreH">↔</button>
           <button class="preset" data-align="right">⇥</button>
         </div>
         <div class="preset-row">
           <button class="preset" data-align="top">⇡</button>
           <button class="preset" data-align="centreV">↕</button>
           <button class="preset" data-align="bottom">⇣</button>
         </div>`
      );
      h += sect('Fade',
        fNum('Fade in (s)','vFadeIn',0,20,0.05) +
        fNum('Fade out (s)','vFadeOut',0,20,0.05) +
        `<div style="font-size:11px;color:var(--dim2);line-height:1.5">
           Plain opacity ramps. Transitions below add movement on top.
         </div>`
      );
      h += sect('Transform',
        fRange('Scale','scale',0.1,4,0.01, v => Math.round(v*100)+'%') +
        fRange('Position X','x',-1500,1500,1) +
        fRange('Position Y','y',-1500,1500,1) +
        fRange('Rotation','rotation',-180,180,1, v => v+'°') +
        fRange('Opacity','opacity',0,1,0.01, v => Math.round(v*100)+'%')
      );

      h += sect('Crop',
        fRange('Left','cropL',0,0.9,0.005) +
        fRange('Right','cropR',0,0.9,0.005) +
        fRange('Top','cropT',0,0.9,0.005) +
        fRange('Bottom','cropB',0,0.9,0.005)
      );

      if (c.type === 'video' || c.type === 'image'){
        const presetBtns = Object.keys(LOOKS).map(k =>
          `<button class="preset${c.look === k ? ' on' : ''}" data-look="${k}">${k}</button>`).join('');
        h += sect('Colour',
          `<div class="preset-row">${presetBtns}</div>` +
          fRange('Brightness','brightness',0.2,2,0.01, v => v.toFixed(2)) +
          fRange('Contrast','contrast',0.2,2,0.01, v => v.toFixed(2)) +
          fRange('Saturation','saturation',0,3,0.01, v => v.toFixed(2)) +
          fRange('Hue','hue',-180,180,1, v => v+'°') +
          fRange('Blur','blurPx',0,30,0.5, v => v+'px')
        );
      }
      if (c.type === 'video' || c.type === 'image'){
        h += sect('Chroma key (green screen)',
          fCheck('Enable','keyOn') + fColor('Key colour','keyColor') +
          fRange('Tolerance','keySim',0.02,1,0.01, v => (+v).toFixed(2)) +
          fRange('Softness','keySoft',0.001,0.6,0.005, v => (+v).toFixed(3)) +
          fRange('Spill removal','keySpill',0,1,0.01, v => Math.round(v*100)+'%')
        );
      }

      if (c.type === 'shape'){
        h += sect('Shape',
          fSel('Kind','shape',[['rect','Rectangle'],['ellipse','Ellipse'],['triangle','Triangle'],['line','Line']]) +
          fColor('Fill','fill') +
          fCheck('Gradient','gradOn') + fColor('Fill 2','fill2') +
          fRange('Gradient angle','gradAngle',0,360,1, v => Math.round(v)+'°') +
          fRange('Width','shapeW',0.02,2,0.01, v => Math.round(v*100)+'%') +
          fRange('Height','shapeH',0.02,2,0.01, v => Math.round(v*100)+'%') +
          fRange('Corner radius','radius',0,0.5,0.01, v => Math.round(v*100)+'%') +
          fCheck('Outline','strokeOn') + fColor('Outline col','strokeColor') + fNum('Outline w','strokeW',0,60,1)
        );

        fCheck('Flip horizontal','flipH') + fCheck('Flip vertical','flipV') +

        fCheck('Tint','tintOn') + fColor('Tint colour','tintColor') +
        fRange('Tint amount','tintAmt',0,1,0.01, v => Math.round(v*100)+'%')

      h += sect('Motion presets',

      );

      h += sect('Colour effects',
        fRange('Invert','invert',0,1,0.01, v => Math.round(v*100)+'%') +
        fRange('Sepia','sepia',0,1,0.01, v => Math.round(v*100)+'%') +

      h += sect('Stylise',
        fRange('Pixelate','pixelate',0,1,0.01, v => Math.round(v*100)+'%') +

        fRange('Glitch','glitch',0,1,0.01, v => Math.round(v*100)+'%') +
        fRange('Scanlines','scanlines',0,1,0.01, v => Math.round(v*100)+'%') +
        fRange('Bloom / glow','bloom',0,1,0.01, v => Math.round(v*100)+'%') +
        fRange('Zoom blur','zoomBlur',0,1,0.01, v => Math.round(v*100)+'%')
      );

        fSel('Mirror','mirrorMode',[['none','None'],['left','Left → right'],['right','Right → left'],
                                    ['top','Top → bottom'],['bottom','Bottom → top'],['quad','Quad']]) +
        fRange('Rounded corners','cornerR',0,0.5,0.01, v => Math.round(v*100)+'%') +
        fNum('Border width','borderW',0,80,1) + fColor('Border colour','borderColor')
      );

      h += sect('Effect presets',
        `<div class="preset-row">
           <button class="preset" data-fx="vhs">VHS</button>
           <button class="preset" data-fx="glitchy">Glitch</button>
           <button class="preset" data-fx="oldFilm">Old film</button>

         </div>`
      );

      h += sect('Compositing', fSel('Blend mode','blend', BLENDS));
      h += sect('Transitions',
        fSel('In','tinType', TRANSITIONS) + fNum('In length','tinDur',0,10,0.05) +
        fSel('Out','toutType', TRANSITIONS) + fNum('Out length','toutDur',0,10,0.05)
      );
    }

    if (c.type === 'text'){
      h += sect('Text style',
        `<div class="preset-row">` +
        Object.keys(TEXT_STYLES).map(k => `<button class="preset" data-tstyle="${k}">${k}</button>`).join('') +
        `</div>`
      );
      h += sect('Text',
        fTextArea('Content','text') +
        fSel('Font','font', [['system','System'],['black','Arial Black'],['impact','Impact'],['serif','Serif'],['mono','Mono']]) +
        fNum('Size','size',10,400,2) +
        fSel('Weight','weight', [[400,'Regular'],[600,'Semibold'],[700,'Bold'],[900,'Black']]) +
        fSel('Align','align', [['left','Left'],['center','Centre'],['right','Right']]) +
        fColor('Colour','color') +

      );
      h += sect('Text style',
        fCheck('Shadow','shadowOn') +
        fCheck('Outline','strokeOn') + fColor('Outline col','strokeColor') + fNum('Outline w','strokeW',0,40,1) +
        fCheck('Box','boxOn') + fColor('Box colour','boxColor')
      );
    }

    if (c.type === 'outro'){
      h += sect('Outro',
        fTextArea('Text','outroText') +
        fColor('Background','outroBg') +
        fColor('Text colour','outroFg')
      );
    }

    if (c.type === 'video' || c.type === 'audio'){
      h += sect('Audio',
        fRange('Volume','volume',0,2,0.01, v => Math.round(v*100)+'%') +
        fRange('Pan','pan',-1,1,0.01, v => {
          const n = +v;
          return Math.abs(n) < 0.02 ? 'centre' : (n < 0 ? 'L' : 'R') + Math.round(Math.abs(n)*100);
        }) +
        fCheck('Mute','muted') +

      );
      h += sect('Equaliser',
        fRange('Low','eqLow',-18,18,0.5, v => (+v>0?'+':'')+(+v).toFixed(1)+' dB') +
        fRange('Mid','eqMid',-18,18,0.5, v => (+v>0?'+':'')+(+v).toFixed(1)+' dB') +
        fRange('High','eqHigh',-18,18,0.5, v => (+v>0?'+':'')+(+v).toFixed(1)+' dB')
      );
    }

    const animated = ANIM_KEYS.filter(k => isAnimated(c, k));
    if (animated.length){
      const easeOpts = ez => EASE_NAMES.map(([v,t]) =>
        `<option value="${v}"${ez === v ? ' selected' : ''}>${t}</option>`).join('');
      h += sect(`Keyframes · ${keyframeTimes(c).length} points`,
        `<div class="fld"><label>New points</label><div class="ctl">
           <select data-kfdefault>${easeOpts(state.kfEase)}</select></div></div>` +
        animated.map(k =>
          `<div class="kf-row">
             <span class="kf-name">${ANIM_LABEL[k] || k}</span>
             <span class="kf-n">${c.kf[k].length}◆</span>

             <button data-kfclear="${k}" title="Remove these keyframes">✕</button>
           </div>`).join('') +
        `<div style="font-size:11px;color:var(--dim2);line-height:1.5;margin-top:7px">
           Move the playhead, then change a value — a keyframe is added there automatically.
           The dropdown sets how that property eases between its points.
         </div>`
      );
    }

    inspector.innerHTML = h;
  }

  // refresh field values in place (used while dragging on canvas / scrubbing animated clips)
  function syncInspectorValues(){
    const c = selectedClip();
    if (!c) return;
    inspector.querySelectorAll('[data-k]').forEach(inp => {
      const key = inp.dataset.k;
      if (!ANIM_KEYS.includes(key) || document.activeElement === inp) return;
      const v = curVal(c, key);
      if (inp.type === 'range' || inp.type === 'number') inp.value = v;
      const out = inspector.querySelector(`[data-out="${key}"]`);
      if (out) out.textContent = fmtVal(key, v);
    });
  }

  inspector.addEventListener('input', e => {
    const c = selectedClip();
    const key = e.target.dataset.k;
    if (!c || !key) return;
    let v;
    if (e.target.type === 'checkbox') v = e.target.checked;
    else if (e.target.type === 'range' || e.target.type === 'number') v = parseFloat(e.target.value);
    else v = e.target.value;
    if (typeof v === 'number' && !isFinite(v)) return;

    if (key === 'weight') v = parseInt(v, 10);
    if (key === 'duration'){
      v = Math.max(0.1, v);
      const a = assets.get(c.assetId);
      if (a && a.duration && (c.type === 'video' || c.type === 'audio')){
        v = Math.min(v, Math.max(0.1, (a.duration - c.inPoint) / c.speed));
      }
    }
    if (key === 'start') v = Math.max(0, v);
    if (key === 'inPoint'){
      const a = assets.get(c.assetId);
      v = clamp(v, 0, a && a.duration ? Math.max(0, a.duration - 0.1) : v);
    }
    if (ANIM_KEYS.includes(key)) setProp(c, key, v);
    else c[key] = v;

    const out = inspector.querySelector(`[data-out="${key}"]`);
    if (out) out.textContent = fmtVal(key, v);
    buildRuler(); buildLanes(); updatePlayheadUI(); updateKfBtn();
    $('tlHint').textContent = `${clipLabel(c)} · ${c.duration.toFixed(2)}s`;
    syncMedia(state.playhead, false);
    renderAt(state.playhead);
  });
  inspector.addEventListener('change', e => {
    const c = selectedClip();
    if (e.target.dataset.kfdefault !== undefined){
      state.kfEase = e.target.value;
      toast('New keyframes will use ' + e.target.value);
      return;
    }
    const ezKey = e.target.dataset.kfez;
    if (ezKey && c && c.kf && c.kf[ezKey]){
      pushUndo();
      c.kf[ezKey].forEach(pt => { pt.ez = e.target.value; });
      renderAt(state.playhead);
      syncInspectorValues();      // the curve changes the value shown at the playhead
      toast(`${ANIM_LABEL[ezKey] || ezKey}: ${e.target.value}`);
      return;
    }
    if (e.target.dataset.k) pushUndo();
  });
  inspector.addEventListener('click', e => {
    const c = selectedClip();
    if (!c) return;
    const look = e.target.dataset.look;
    const kfKey = e.target.dataset.kf;
    const kfClear = e.target.dataset.kfclear;

    const fx = e.target.dataset.fx;
    if (fx){
      pushUndo();
      const FX = {
        vhs:     { rgbSplit:0.35, scanlines:0.45, grain:0.35, saturation:1.2, contrast:1.08, glitch:0.12 },
        glitchy: { glitch:0.6, rgbSplit:0.5, contrast:1.12, scanlines:0.2 },
        oldFilm: { gray:0.85, grain:0.6, vignette:0.55, contrast:1.15, sepia:0.35 },
        dream:   { bloom:0.6, blurPx:1.5, saturation:1.25, brightness:1.06 },
        comic:   { posterize:5, contrast:1.35, saturation:1.5 },
        clearFx: { invert:0, sepia:0, gray:0, posterize:0, threshold:0, glitch:0, scanlines:0,
                   bloom:0, zoomBlur:0, rgbSplit:0, grain:0, pixelate:0, vignette:0,
                   mirrorMode:'none', cornerR:0, borderW:0, blurPx:0,
                   brightness:1, contrast:1, saturation:1, hue:0, look:'none' }
      };
      Object.assign(c, FX[fx]);
      renderInspector(); renderAt(state.playhead);
      toast(fx === 'clearFx' ? 'Effects cleared' : fx + ' preset');
      return;
    }
    const tstyle = e.target.dataset.tstyle;
    if (tstyle){
      pushUndo();
      Object.assign(c, TEXT_STYLES[tstyle]);
      renderInspector(); buildLanes(); renderAt(state.playhead);
      toast(tstyle + ' style');
      return;
    }
    const label = e.target.dataset.label;
    if (label !== undefined){
      pushUndo();
      selClips().forEach(x => { x.label = label; });
      renderInspector(); buildLanes();
      return;
    }
    const fit = e.target.dataset.fit;
    const align = e.target.dataset.align;
    const motion = e.target.dataset.motion;
    if (fit || align){
      pushUndo();
      const W = state.width, H = state.height;
      const r = contentRect(c);
      if (fit === 'reset'){ c.scale = 1; c.x = 0; c.y = 0; c.rotation = 0; }
      else if (fit === 'fit') c.scale = Math.min(W / r.w, H / r.h);
      else if (fit === 'fill') c.scale = Math.max(W / r.w, H / r.h);
      else {
        const sc = c.scale || 1;
        const hw = (r.w * sc) / 2, hh = (r.h * sc) / 2;
        if (align === 'left') c.x = -(W/2 - hw);
        if (align === 'right') c.x = (W/2 - hw);
        if (align === 'centreH') c.x = 0;
        if (align === 'top') c.y = -(H/2 - hh);
        if (align === 'bottom') c.y = (H/2 - hh);
        if (align === 'centreV') c.y = 0;
      }
    } else if (motion){
      pushUndo();
      applyMotionPreset(c, motion);
      toast('Applied ' + motion.replace(/([A-Z])/g, ' $1').toLowerCase());
    } else if (look){
      pushUndo();
      Object.assign(c, LOOKS[look], { look });
    } else if (kfKey){
      pushUndo();
      toggleAnimate(c, kfKey);
      toast(isAnimated(c, kfKey)
        ? `${ANIM_LABEL[kfKey]} keyframed at ${tcFmt(state.playhead)}`
        : `${ANIM_LABEL[kfKey]} keyframes removed`);
    } else if (kfClear){
      pushUndo();
      const v = curVal(c, kfClear);
      delete c.kf[kfClear];
      c[kfClear] = v;
    } else return;

    renderInspector();
    buildLanes();
    renderAt(state.playhead);
  });

  /* ================= BIN ================= */
  function renderBin(){
    $('binCount').textContent = assets.size + (assets.size === 1 ? ' item' : ' items');
    if (!assets.size){
      binList.innerHTML = `<div class="empty">No media yet.<br>Import clips, photos or audio to begin.</div>`;
      return;
    }
    const q = ($('binSearch').value || '').trim().toLowerCase();
    const shown = [...assets.values()].filter(a => !q || a.name.toLowerCase().includes(q));
    if (!shown.length){
      binList.innerHTML = `<div class="empty">Nothing matches “${esc(q)}”.</div>`;
      return;
    }
    let h = '';
    for (const a of shown){
      const sub = a.kind === 'image'
        ? (a.width ? `${a.width}×${a.height}` : 'image')
        : (a.duration ? tcFmt(a.duration) : '…');
      h += `<div class="bin-item" data-asset="${a.id}">
        <div class="bin-thumb" data-thumb="${a.id}">${a.kind === 'audio' ? '♪' : ''}</div>
        <div class="bin-meta"><div class="bin-name">${esc(a.name)}</div><div class="bin-sub">${sub}</div></div>
        <button class="bin-add" title="Add to timeline">＋</button>
        <button class="bin-add bin-del" title="Remove from project">✕</button>
      </div>`;
    }
    binList.innerHTML = h;
    for (const a of shown){
      const holder = binList.querySelector(`[data-thumb="${a.id}"]`);
      if (!holder || a.kind === 'audio') continue;
      if (a.kind === 'image'){ const im = new Image(); im.src = a.url; holder.appendChild(im); }
      else { const v = document.createElement('video'); v.src = a.url; v.muted = true; v.preload = 'metadata'; holder.appendChild(v); }
    }
  }
  binList.addEventListener('click', e => {
    const item = e.target.closest('[data-asset]');
    if (!item) return;
    if (e.target.classList.contains('bin-del')){ removeAsset(item.dataset.asset); return; }
    addAssetToTimeline(item.dataset.asset);
  });
  function removeAsset(id){
    const a = assets.get(id);
    if (!a) return;
    const used = allClips().filter(c => c.assetId === id);
    if (used.length && !confirm(`"${a.name}" is used by ${used.length} clip(s). Remove it and those clips?`)) return;
    pushUndo();
    state.tracks.forEach(tr => { tr.clips = tr.clips.filter(c => c.assetId !== id); });
    URL.revokeObjectURL(a.url);
    assets.delete(id);
    setSel(state.sel.filter(cid => findClip(cid)));
    pruneRuntime();
    rebuild();
    toast('Removed ' + a.name);
  }
  function purgeUnused(){
    const used = new Set(allClips().map(c => c.assetId).filter(Boolean));
    const dead = [...assets.values()].filter(a => !used.has(a.id));
    if (!dead.length) return toast('Nothing unused in the project');
    dead.forEach(a => { URL.revokeObjectURL(a.url); assets.delete(a.id); });
    renderBin();
    toast(`Removed ${dead.length} unused item${dead.length>1?'s':''}`);
  }
  $('importInput').addEventListener('change', e => {
    importFiles(Array.from(e.target.files));
    e.target.value = '';
  });
  $('binSearch').addEventListener('input', renderBin);
  $('projFileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); }
    catch(err){ return toast('That is not a readable project file'); }
    if (!data || !Array.isArray(data.tracks)) return toast('That file has no timeline in it');
    stopPlayback();
    pushUndo();
    state.tracks = data.tracks;
    state.width = data.width || state.width;
    state.height = data.height || state.height;
    state.fps = data.fps || 30;
    state.pxPerSec = data.pxPerSec || 80;
    state.markers = data.markers || [];
    state.projectName = data.name || 'Imported project';
    state.projectId = null;
    uidN = Math.max(uidN, data.uidN || 1);
    setSel([]);
    pruneRuntime();
    allClips().forEach(ensureRuntime);
    $('resSelect').value = `${state.width}x${state.height}`;
    resizeStage(); setPlayhead(0); rebuild(); updateProjectLabel();
    const missing = allClips().filter(c => c.assetId && !assets.get(c.assetId)).length;
    toast(missing ? `Loaded — ${missing} clip(s) need their media re-imported` : 'Project file loaded');
  });

  /* ================= EXPORT ================= */
  const MIMES = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=h264,aac',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  let recorder = null, chunks = [], recMime = '';

  function doExport(){
    if (exporting || playing) return;
    if (totalDuration() <= 0) return toast('Timeline is empty');
    recMime = window.MediaRecorder ? (MIMES.find(m => MediaRecorder.isTypeSupported(m)) || '') : '';
    if (!recMime) return toast('This browser cannot record video');

    const ac = ensureAudio();
    if (ac && ac.state === 'suspended') ac.resume();

    const stream = stage.captureStream(state.fps);
    if (recordDest) recordDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

    try {
      recorder = new MediaRecorder(stream, {
        mimeType: recMime,
        videoBitsPerSecond: parseInt($('qualitySelect').value, 10) || 14000000
      });
    } catch(e){ return toast('This browser cannot record video'); }

    chunks = [];
    recorder.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = () => {
      exporting = false;
      $('exportOverlay').classList.remove('on');
      $('expFill').style.width = '0%';
      const ext = recMime.startsWith('video/mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: recMime });
      const name = `voxprints-${state.width}x${state.height}.${ext}`;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Exported ' + name);
    };

    exporting = true;
    $('exportOverlay').classList.add('on');
    const span = rangeEnd() - rangeStart();
    $('exportMsg').textContent =
      `Recording ${tcFmt(span)}${hasRange() ? ' (in/out range)' : ''} in real time. Keep this tab visible.`;
    setPlayhead(rangeStart());
    recorder.start();
    startPlayback();
  }

  /* ================= PROJECT SAVE / LOAD (IndexedDB) ================= */
  const DB_NAME = 'voxstudio', DB_VER = 1;
  function idb(){
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath:'id' });
        if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets', { keyPath:'id' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

  function updateProjectLabel(){
    $('projLabel').innerHTML = state.projectName
      ? `<b>${esc(state.projectName)}</b>`
      : 'Unsaved project';
  }

  async function saveProject(asNew, quiet){
    if (!state.projectId || asNew){
      if (quiet) return;
      const name = prompt('Project name', state.projectName || 'Untitled project');
      if (!name) return;
      state.projectId = uid('p');
      state.projectName = name.trim() || 'Untitled project';
    }
    try {
      const db = await idb();
      const used = [...new Set(allClips().map(c => c.assetId).filter(Boolean))];
      const t = db.transaction(['assets','projects'], 'readwrite');
      const astore = t.objectStore('assets');
      for (const id of used){
        const a = assets.get(id);
        if (!a || !a.file) continue;
        astore.put({ id:a.id, name:a.name, kind:a.kind, blob:a.file,
                     duration:a.duration, width:a.width, height:a.height });
      }
      t.objectStore('projects').put({
        id: state.projectId, name: state.projectName, savedAt: Date.now(),
        data: { tracks: state.tracks, width: state.width, height: state.height, fps: state.fps,
                pxPerSec: state.pxPerSec, uidN, assetIds: used }
      });
      await txDone(t);
      updateProjectLabel();
      if (!quiet) toast(`Saved "${state.projectName}"`);
    } catch (err){
      toast('Save failed: ' + (err && err.name === 'QuotaExceededError' ? 'not enough storage' : 'storage error'));
    }
  }

  async function listProjects(){
    const db = await idb();
    const rows = await reqP(db.transaction('projects','readonly').objectStore('projects').getAll());
    return rows.sort((a,b) => b.savedAt - a.savedAt);
  }

  async function openProjectBrowser(){
    const body = $('projectsBody');
    body.innerHTML = '<div class="empty">Loading…</div>';
    $('projectsOverlay').classList.add('on');
    let rows = [];
    try { rows = await listProjects(); } catch(e){ body.innerHTML = '<div class="empty">Could not read saved projects.</div>'; return; }
    if (!rows.length){ body.innerHTML = '<div class="empty">No saved projects yet.<br>Use File → Save project.</div>'; return; }
    body.innerHTML = rows.map(p => `
      <div class="proj-row">
        <div class="pmeta">
          <div class="pname">${esc(p.name)}</div>
          <div class="pdate">${new Date(p.savedAt).toLocaleString()} · ${p.data.width}×${p.data.height}</div>
        </div>
        <button class="btn" data-open="${p.id}">Open</button>
        <button class="btn" data-del="${p.id}">Delete</button>
      </div>`).join('');
  }

  $('projectsBody').addEventListener('click', async e => {
    const openId = e.target.dataset.open, delId = e.target.dataset.del;
    if (openId){ $('projectsOverlay').classList.remove('on'); await loadProject(openId); }
    else if (delId){
      const db = await idb();
      const t = db.transaction('projects','readwrite');
      t.objectStore('projects').delete(delId);
      await txDone(t);
      openProjectBrowser();
    }
  });

  async function loadProject(id){
    let proj, recs = [];
    try {
      const db = await idb();
      const t = db.transaction(['assets','projects'], 'readonly');
      proj = await reqP(t.objectStore('projects').get(id));
      if (!proj) return toast('Project not found');
      for (const aid of (proj.data.assetIds || [])) recs.push(await reqP(t.objectStore('assets').get(aid)));
    } catch(e){ return toast('Could not open that project'); }

    stopPlayback();
    for (const [, rt] of runtime){ try { rt.el.pause(); } catch(e){} }
    runtime.clear();
    for (const a of assets.values()) URL.revokeObjectURL(a.url);
    assets.clear();

    recs.filter(Boolean).forEach(r => {
      const a = { id:r.id, name:r.name, kind:r.kind, file:r.blob, url:URL.createObjectURL(r.blob),
                  duration:r.duration, width:r.width, height:r.height, peaks:null };
      assets.set(a.id, a);
      if (a.kind === 'image'){
        const im = new Image();
        im.onload = () => { a.el = im; renderBin(); if (!playing) renderAt(state.playhead); };
        im.src = a.url;
      } else decodePeaks(a);
    });

    state.tracks = proj.data.tracks;
    state.width = proj.data.width; state.height = proj.data.height; state.fps = proj.data.fps || 30;
    state.pxPerSec = proj.data.pxPerSec || 80;
    uidN = Math.max(uidN, proj.data.uidN || 1);
    state.projectId = proj.id; state.projectName = proj.name;
    setSel([]);
    state.activeTrack = (state.tracks.find(t => t.kind === 'video') || state.tracks[0] || {}).id || null;
    undoStack.length = 0; redoStack.length = 0;
    allClips().forEach(ensureRuntime);
    $('resSelect').value = `${state.width}x${state.height}`;
    resizeStage();
    setPlayhead(0);
    rebuild();
    updateProjectLabel();
    toast(`Opened "${proj.name}"`);
  }

  function newProject(){
    if (totalDuration() > 0 && !confirm('Start a new project? Unsaved changes will be lost.')) return;
    stopPlayback();
    for (const [, rt] of runtime){ try { rt.el.pause(); } catch(e){} }
    runtime.clear();
    state.tracks = [ makeTrack('video','V2'), makeTrack('video','V1'), makeTrack('audio','A1') ];
    state.activeTrack = state.tracks[1].id;
    setSel([]); state.markers = []; state.inPoint = state.outPoint = null;
    state.projectId = null; state.projectName = '';
    undoStack.length = 0; redoStack.length = 0;
    setPlayhead(0); rebuild(); updateProjectLabel();
    toast('New project');
  }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });

    freeze: cmdFreezeFrame,
    group: cmdGroup,
    ungroup: cmdUngroup,
    normalize: cmdNormalize,
    duck: cmdDuck,
    quickFade: cmdQuickFade,
    closeGaps: cmdCloseGaps,
    duplicateTrack: () => {
      const tr = state.tracks.find(t => t.id === state.activeTrack);
      if (!tr) return toast('Pick a track first');
      pushUndo();
      const copy = JSON.parse(JSON.stringify(tr));
      copy.id = uid('t'); copy.name = tr.name + ' copy'; copy.solo = false;
      copy.clips.forEach(c => { c.id = uid('c'); });
      state.tracks.splice(state.tracks.indexOf(tr), 0, copy);
      copy.clips.forEach(ensureRuntime);
      rebuild(); toast('Track duplicated');
    },
    matchSequence: () => {
      const c = allClips().find(x => x.type === 'video' || x.type === 'image');
      if (!c) return toast('Add a video or photo first');
      const src = sourceSize(c);
      if (!src) return toast('That clip has not loaded yet');
      pushUndo();
      const long = 1920;
      const k = long / Math.max(src.w, src.h);
      state.width = Math.round(src.w * k / 2) * 2;
      state.height = Math.round(src.h * k / 2) * 2;
      $('resSelect').value = `${state.width}x${state.height}`;
      resizeStage(); renderAt(state.playhead);
      toast(`Sequence matched to ${state.width}×${state.height}`);
    },
    purgeUnused,
    zoomSelection: () => {
      const clips = selClips();
      if (!clips.length) return commands.zoomFit();
      const a = Math.min(...clips.map(c => c.start));
      const b = Math.max(...clips.map(c => c.start + c.duration));
      const span = Math.max(0.2, b - a);
      state.pxPerSec = clamp((tlScroll.clientWidth - 60) / span, 8, 600);
      rebuild();
      tlScroll.scrollLeft = Math.max(0, a * state.pxPerSec - 30);
    },
    zoomIn: () => { state.pxPerSec = clamp(state.pxPerSec * 1.3, 8, 600); rebuild(); },
    zoomOut: () => { state.pxPerSec = clamp(state.pxPerSec / 1.3, 8, 600); rebuild(); },
    zoomFit: () => {
      const total = totalDuration();
      if (total > 0) state.pxPerSec = clamp((tlScroll.clientWidth - 40) / total, 8, 600);
      rebuild();
    },
    snapToggle: () => {
      state.snap = !state.snap;
      $('snapBtn').classList.toggle('on', state.snap);
      toast('Snapping ' + (state.snap ? 'on' : 'off'));
    },
    shortcuts: () => $('shortcutsOverlay').classList.add('on')
  };

  document.addEventListener('click', e => {
    const cmdEl = e.target.closest('[data-cmd]');
    if (cmdEl && commands[cmdEl.dataset.cmd]){
      commands[cmdEl.dataset.cmd]();
      document.querySelectorAll('.mb-item.open').forEach(m => m.classList.remove('open'));
      return;
    }
    const menu = e.target.closest('.mb-item');
    document.querySelectorAll('.mb-item.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
    if (menu && e.target.closest('.mb-btn')) menu.classList.toggle('open');
    if (e.target.dataset.close !== undefined || e.target.classList.contains('overlay')){
      document.querySelectorAll('.overlay.on').forEach(o => { if (o.id !== 'exportOverlay') o.classList.remove('on'); });
    }
  });

  document.querySelectorAll('[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tool = btn.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b === btn));
      document.body.classList.toggle('blade', state.tool === 'blade');
    });
  });

  tcNow.style.cursor = 'text';
  tcNow.title = 'Click to type a timecode';
  tcNow.addEventListener('click', () => {
    if (tcNow.querySelector('input')) return;
    stopPlayback();
    const cur = tcFmt(state.playhead);
    tcNow.innerHTML = `<input class="tc-input" value="${cur}" spellcheck="false">`;
    const inp = tcNow.querySelector('input');
    inp.focus(); inp.select();
    const commit = () => {
      const v = inp.value.trim();
      let secs = null;
      const m = v.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})(?:[.:](\d{1,2}))?$/);
      if (m) secs = (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]) + (m[4] ? (+m[4])/state.fps : 0);
      else if (/^\d+(\.\d+)?$/.test(v)) secs = parseFloat(v);
      tcNow.textContent = tcFmt(state.playhead);
      if (secs !== null) setPlayhead(secs);
      else if (v) toast('Type a time like 0:05.10 or 5.4');
    };
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter'){ ev.preventDefault(); commit(); }
      if (ev.key === 'Escape'){ ev.preventDefault(); tcNow.textContent = tcFmt(state.playhead); }
    });
    inp.addEventListener('blur', commit);
  });

  $('masterVol').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    ensureAudio();
    if (masterGain) masterGain.gain.value = v;
  });
  function pumpMeter(){
    if (analyser && meterBuf && (playing || exporting)){
      analyser.getByteTimeDomainData(meterBuf);
      let peak = 0;
      for (let i = 0; i < meterBuf.length; i += 4){
        const d = Math.abs(meterBuf[i] - 128) / 128;
        if (d > peak) peak = d;
      }
      $('meterFill').style.width = Math.min(100, peak * 130).toFixed(0) + '%';
    } else {
      $('meterFill').style.width = '0%';
    }
    requestAnimationFrame(pumpMeter);
  }
  requestAnimationFrame(pumpMeter);

  playBtn.addEventListener('click', () => { state.rate = 1; togglePlay(); });
  $('goStart').addEventListener('click', () => { stopPlayback(); setPlayhead(0); });
  $('goEnd').addEventListener('click', () => { stopPlayback(); setPlayhead(totalDuration()); });
  $('stepBack').addEventListener('click', () => { stopPlayback(); setPlayhead(state.playhead - 1/state.fps); });
  $('stepFwd').addEventListener('click', () => { stopPlayback(); setPlayhead(state.playhead + 1/state.fps); });

  $('exportBtn').addEventListener('click', doExport);
  $('previewQ').addEventListener('change', e => {
    state.draft = e.target.value === 'draft';
    renderAt(state.playhead);
    toast(state.draft ? 'Draft preview — export stays full quality' : 'Full preview');
  });
  $('fpsSelect').addEventListener('change', e => {
    state.fps = parseInt(e.target.value, 10) || 30;
    updatePlayheadUI();
    toast(state.fps + ' fps');
  });
  $('resSelect').addEventListener('change', e => {
    const [w,h] = e.target.value.split('x').map(Number);
    pushUndo();
    state.width = w; state.height = h;
    resizeStage(); renderAt(state.playhead);
    toast(`Sequence set to ${w}×${h}`);
  });

  const SHORTCUTS = [
    ['— Playback —',''],
    ['Space','Play / pause'], ['J / K / L','Shuttle slower / stop / faster'],
    ['← →','Step one frame'], ['Shift ← →','Jump one second'],
    ['Home / End','Go to start / end'], ['Ctrl L','Loop playback'],
    ['Click the timecode','Type a time to jump there'],
    ['— Selecting —',''],
    ['V','Selection tool'], ['C','Blade tool — also splits the selected clip'],
    ['Shift click','Add a clip to the selection'], ['Ctrl A','Select all clips'],
    ['Ctrl G / Ctrl Shift G','Group / ungroup clips'], ['Right click','Clip menu'],
    ['— Editing —',''],
    ['Ctrl C / X / V','Copy / cut / paste at the playhead'],
    ['Ctrl D','Duplicate'], ['Delete','Delete'], ['Shift Delete','Ripple delete'],
    ['Ctrl Shift K','Split every track'], ['E','Enable / disable clip'],
    ['F','Freeze frame'], [', / .','Nudge one frame'],
    ['Alt drag clip edge','Ripple trim'],
    ['Ctrl Z / Ctrl Shift Z','Undo / redo'],
    ['— Markers and range —',''],
    ['M','Add / remove marker'], ['Shift M / Alt M','Previous / next marker'],
    ['I / O','Mark in / out'], ['Ctrl Shift X','Clear in and out'],
    ['— Animation —',''],
    ['K','Add / remove a keyframe at the playhead'],
    ['◆ button','Keyframe that single property'],
    ['Drag on canvas','Move the selected clip'], ['Corner handles','Scale it'],
    ['Round handle','Rotate (hold Shift to snap 15°)'],
    ['Double-click text','Edit it on the canvas'],
    ['— View —',''],
    ['+ / −','Zoom the timeline'], ['Shift Z','Zoom to fit'], ['S','Toggle snapping'],
    ['— Files —',''],
    ['Shift I','Import media'], ['T','New text clip'], ['Shift O','New logo outro'],
    ['Ctrl S / Ctrl Shift S','Save project / save as'], ['Ctrl E','Export video'],
    ['?','This list']
  ];

  $('shortcutsBody').innerHTML = SHORTCUTS.map(([k,d]) =>
    d === '' ? `<div class="kbd-head">${k.replace(/—/g,'').trim()}</div>`
             : `<div class="kbd-row"><span>${d}</span><kbd>${k}</kbd></div>`).join('');

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (typing) return;
    const mod = e.ctrlKey || e.metaKey;

    const key = e.key.toLowerCase();
    if (mod && key === 's'){ e.preventDefault(); saveProject(e.shiftKey); return; }
    if (mod && key === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && key === 'd'){ e.preventDefault(); cmdDuplicate(); return; }
    if (mod && key === 'e'){ e.preventDefault(); doExport(); return; }
    if (mod && key === 'c'){ e.preventDefault(); cmdCopy(false); return; }
    if (mod && key === 'x' && e.shiftKey){ e.preventDefault(); clearInOut(); return; }
    if (mod && key === 'x'){ e.preventDefault(); cmdCopy(true); return; }
    if (mod && key === 'v'){ e.preventDefault(); cmdPaste(); return; }
    if (mod && key === 'a'){ e.preventDefault(); cmdSelectAll(); return; }
    if (mod && key === 'k' && e.shiftKey){ e.preventDefault(); cmdSplitAll(); return; }
    if (mod && key === 'l'){ e.preventDefault(); commands.loopToggle(); return; }
    if (mod && key === 'g'){ e.preventDefault(); e.shiftKey ? cmdUngroup() : cmdGroup(); return; }
    if (mod) return;

    switch (e.key){
      case ' ': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); stopPlayback(); setPlayhead(state.playhead - (e.shiftKey ? 1 : 1/state.fps)); break;
      case 'ArrowRight': e.preventDefault(); stopPlayback(); setPlayhead(state.playhead + (e.shiftKey ? 1 : 1/state.fps)); break;
      case 'Home': e.preventDefault(); stopPlayback(); setPlayhead(0); break;
      case 'End': e.preventDefault(); stopPlayback(); setPlayhead(totalDuration()); break;
      case 'Delete': case 'Backspace': e.preventDefault(); cmdDelete(e.shiftKey); break;
      case '+': case '=': commands.zoomIn(); break;
      case '-': case '_': commands.zoomOut(); break;
      case '?': commands.shortcuts(); break;
      case ',': e.preventDefault(); cmdNudge(-1); break;
      case '.': e.preventDefault(); cmdNudge(1); break;
      default: {
        const k = e.key.toLowerCase();
        if (k === 'm'){ e.altKey ? gotoMarker(1) : e.shiftKey ? gotoMarker(-1) : addMarker(); }
        else if (k === 'i'){ e.shiftKey ? commands.import() : setIn(); }
        else if (k === 'o'){ e.shiftKey ? commands.addOutro() : setOut(); }
        else if (k === 'e'){ cmdToggleEnabled(); }
        else if (k === 'v'){ document.querySelector('[data-tool="select"]').click(); }
        else if (k === 'c'){
          if (selectedClip()) cmdSplit();
          document.querySelector('[data-tool="blade"]').click();
        }
        else if (k === 'f'){ cmdFreezeFrame(); }
        else if (k === 'j'){
          state.rate = state.rate > 0 ? Math.max(0.25, state.rate / 2) : state.rate;
          if (!playing) startPlayback();
          toast('Rate ' + state.rate.toFixed(2) + '×');
        }
        else if (k === 'l' && !e.ctrlKey && !e.metaKey){
          state.rate = Math.min(8, state.rate * 2);
          if (!playing) startPlayback();
          toast('Rate ' + state.rate.toFixed(2) + '×');
        }
        else if (k === 'k'){
          if (playing){ stopPlayback(); state.rate = 1; toast('Paused'); }
          else toggleKeyframeHere();
        }
        else if (k === 's'){ commands.snapToggle(); }
        else if (k === 't'){ commands.addText(); }
        else if (k === 'z' && e.shiftKey){ commands.zoomFit(); }
      }
    }
  });

  window.addEventListener('resize', () => { buildRuler(); buildLanes(); updatePlayheadUI(); updateOverlay(); });

  // autosave: only ever overwrites a project the user already named and saved
  let autosaveTimer = null;
  function scheduleAutosave(){
    if (!state.projectId) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      if (!state.projectId || playing || exporting) return;
      saveProject(false, true);
    }, 20000);
  }
  const _pushUndo = pushUndo;
  pushUndo = function(){ _pushUndo(); scheduleAutosave(); };

  /* ---------- boot ---------- */
  state.tracks = [ makeTrack('video','V2'), makeTrack('video','V1'), makeTrack('audio','A1') ];
  state.activeTrack = state.tracks[1].id;
  resizeStage();
  updateProjectLabel();
  rebuild();
  renderAt(0);
  }
</script>
</body>
</html>
