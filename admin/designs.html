<style>
  .ico{ vertical-align:-0.18em; flex-shrink:0; }
  :root{
    --bg: #f6f8fa;
    --bg-raised: #ffffff;
    --ink: #1f2328;
    --ink-dim: #656d76;
    --accent: #0969da;
    --err: #cf222e;
    --ok: #1a7f37;
    --btn-hover-bg: #eef1f4;
    --btn-primary-hover: #0860ca;
    --warn: #9a6700;
    --border-tint: 31,35,40;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0d1117;
      --bg-raised: #161b22;
      --ink: #e6edf3;
      --ink-dim: #8b949e;
      --accent: #4493f8;
      --err: #f85149;
      --ok: #3fb950;
      --btn-hover-bg: #21262d;
      --btn-primary-hover: #5aa6ff;
      --warn: #e3b341;
      --border-tint: 255,255,255;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0d1117;
    --bg-raised: #161b22;
    --ink: #e6edf3;
    --ink-dim: #8b949e;
    --accent: #4493f8;
    --err: #f85149;
    --ok: #3fb950;
    --btn-hover-bg: #21262d;
    --btn-primary-hover: #5aa6ff;
    --warn: #e3b341;
    --border-tint: 255,255,255;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  }
  @keyframes fadeInDown{ from{ opacity:0; transform: translateY(-8px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(12px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes popIn{ from{ opacity:0; transform: scale(0.92);} to{ opacity:1; transform: scale(1);} }
  @keyframes pulseSoft{ 0%,100%{ opacity:0.6; } 50%{ opacity:1; } }
  @keyframes shakeX{ 10%,90%{ transform: translateX(-1px);} 20%,80%{ transform: translateX(2px);} 30%,50%,70%{ transform: translateX(-3px);} 40%,60%{ transform: translateX(3px);} }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  a, button, .btn{ transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s ease, box-shadow 0.15s, opacity 0.15s; }
  button:active, .btn:active{ transform: translateY(0) scale(0.96); }
  button:disabled, .btn:disabled{ animation: pulseSoft 1.1s ease-in-out infinite; cursor: wait; }
  .login-card{ animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
  .login-err.show{ animation: shakeX 0.4s ease both; }
  .modal-error[style*="block"]{ animation: shakeX 0.4s ease both; }

  #login-view{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card{
    background: var(--bg-raised); border:1px solid rgba(var(--border-tint),0.12);
    border-radius: var(--radius); padding: 32px; width: 320px;
  }
  .login-card h1{ font-size:19px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .login-card h1 .brand-text span{ color: var(--accent); }
  .logo-mark{ flex-shrink: 0; display:block; }
  .logo-loading{ flex-shrink: 0; display:block; }
  .logo-loading polygon{
    transform-box: fill-box;
    transform-origin: center;
    animation: facetGrow 2s ease-in-out infinite backwards;
  }
  @keyframes facetGrow{
    0%   { transform: scale(0.3); }
    30%  { transform: scale(1.15); }
    80%  { transform: scale(1.15); }
    100% { transform: scale(0.3); }
  }
  .login-card .sub{ color: var(--ink-dim); font-size:13px; margin: 0 0 20px; }
  .login-card label{ display:block; font-size:13px; font-weight:600; margin: 12px 0 5px; }
  .login-card input{
    width:100%; padding:8px 11px; border:1px solid rgba(var(--border-tint),0.18);
    border-radius:6px; font-size:16px; font-family:inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-card input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.12); }
  .login-card button{
    width:100%; margin-top:18px; padding:9px; background: var(--accent); color:#fff;
    border:none; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .login-card button:hover:not(:disabled){ background: var(--btn-primary-hover); }
  .login-card button:disabled{ opacity:0.65; cursor:default; }
  .login-card input{ transition: border-color 0.15s, box-shadow 0.15s; }
  .login-card input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.14); }
  .login-err{ display:none; color: var(--err); font-size:12.5px; margin-top:10px; }
  .login-err.show{ display:block; }

  #dash-view{ display:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 28px; border-bottom: 1px solid rgba(var(--border-tint),0.10);
    animation: fadeInDown 0.4s ease both;
  }
  .topbar h1{ font-size:19px; margin:0; display:flex; align-items:center; gap:8px; }
  .topbar h1 .brand-text span{ color: var(--accent); }
  .topbar .right{ display:flex; gap:10px; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
    font-size:13.5px; font-weight:600; border-radius:6px; cursor:pointer;
    border:1px solid rgba(var(--border-tint),0.15); background: var(--bg-raised); color: var(--ink);
    text-decoration:none; transition: background 0.15s, transform 0.15s;
  }
  .btn:hover{ background: var(--bg); transform: translateY(-1px); }
  .btn-primary{ background: var(--accent); border-color: rgba(31,35,40,0.15); color:#fff; }
  .btn-primary:hover{ background: var(--btn-primary-hover); }
  .theme-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0;
    border:1px solid rgba(var(--border-tint),0.15); background: var(--bg-raised); color: var(--ink);
    font-size: 15px; cursor:pointer; line-height:1;
    transition: background 0.15s, transform 0.15s;
  }
  .theme-toggle-btn:hover{ background: var(--bg); transform: translateY(-1px); }

  .page{ max-width: 900px; margin:0 auto; padding: 28px 24px 80px; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-top:20px; }
  .grid-spinner{ grid-column:1/-1; display:flex; align-items:center; justify-content:center; min-height:50vh; }
  .grid-spinner span{
    width:22px; height:22px; border-radius:50%;
    border:3px solid rgba(9,105,218,0.18); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  .grid-empty{ grid-column:1/-1; color: var(--ink-dim); font-size:13.5px; padding:20px 0; text-align:center; }
  .grid-empty a{ color: var(--accent); }
  .tile{
    background: var(--bg-raised); border:1px solid rgba(var(--border-tint),0.12); border-radius:10px;
    overflow:hidden; opacity:0; transform: translateY(12px);
    animation: fadeInUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
    transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease, opacity 0.2s ease;
  }
  .tile:hover{ box-shadow: 0 6px 20px rgba(31,35,40,0.1); transform: translateY(-3px); border-color: rgba(var(--border-tint),0.2); }
  .tile-img img{ transition: transform 0.3s ease; }
  .tile:hover .tile-img img{ transform: scale(1.04); }
  .tile-img{
    width:100%; aspect-ratio:4/3; object-fit:cover; background: var(--bg);
    display:flex; align-items:center; justify-content:center; color: var(--ink-dim); font-size:12px;
  }
  .tile-body{ padding:12px 14px; }
  .tile-name{ font-weight:600; font-size:14px; margin-bottom:3px; }
  .tile-price{ font-family: ui-monospace, monospace; font-size:12.5px; color: var(--accent); margin-bottom:8px; }
  .tile-actions{ display:flex; gap:8px; }
  .tile-actions button{
    flex:1; padding:6px; font-size:12.5px; border-radius:6px; cursor:pointer;
    border:1px solid rgba(var(--border-tint),0.15); background: var(--bg); color: var(--ink);
    transition: background 0.15s, transform 0.12s ease, border-color 0.15s, color 0.15s;
  }
  .tile-actions button.danger{ color: var(--err); }
  .tile-actions button:hover{ background: var(--btn-hover-bg); transform: translateY(-1px); }
  .tile-actions button:active{ transform: translateY(0) scale(0.94); }
  .tile-actions button.pin-btn.pinned{ color: var(--warn); border-color: rgba(154,103,0,0.4); background: rgba(154,103,0,0.08); }
  .tile.inactive{ opacity: 0.55; }
  .tile-badge{
    display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; color: var(--ink-dim); margin-left:6px;
  }
  .tile-badge.pin{ color: var(--warn); }
  .tile-badge.instant{ color: var(--accent); }

  .tile-model-badge{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; font-weight:700; color: var(--accent);
    background: rgba(9,105,218,0.1); border-radius:20px; padding:2px 8px; margin-top:6px;
  }
</style>

<script>
  (function(){
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function currentTheme(){
      const explicit = localStorage.getItem('theme');
      if (explicit) return explicit;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(mode){
      const isDark = mode === 'dark';
      toggle.innerHTML = isDark ? '<svg class="ico" width="1em" height="1em" aria-hidden="true"><use href="/icons.svg#sun"/></svg>' : '<svg class="ico" width="1em" height="1em" aria-hidden="true"><use href="/icons.svg#moon"/></svg>';
      toggle.setAttribute('aria-pressed', String(isDark));
    }
    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      document.documentElement.setAttribute('data-theme', next);
      applyTheme(next);
    });
    applyTheme(currentTheme());
  })();
</script>

<script type="module">

  function publicUrl(path){
    return path ? supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl : null;

  // Being signed in is not enough to see this dashboard — customers can
  // hold a Supabase session too (Google sign-in), so confirm the account
  // is an actual admin before showing anything.
  // Retries a lookup a couple of times so a network blip while confirming the
  // login never looks like 'not an admin' (which signs the person out).
  async function withRetry(fn){
    let r;
    for (let i = 0; i < 3; i++){
      r = await fn();
      if (!r.error) return r;
      await new Promise(res => setTimeout(res, 700 * (i + 1)));
    }
    return r;
  }
  async function isAdmin(userId){
    const { data, error } = await withRetry(() => supabase
      .from('admin_profiles')
      .select('id')
      .eq('id', userId)
      .maybeSingle());
    return error ? null : !!data;
  }

    if (!session){ showLogin(); return; }
    const ok = await isAdmin(session.user.id);

      showLogin();
    } else if (ok){
      showDashboard();
    } else {
      await supabase.auth.signOut();
      showLogin();
    }

    loginBtn.textContent = 'Sign in';

      errEl.textContent = error.message;
      errEl.classList.add('show');

  async function deleteDesign(id){
