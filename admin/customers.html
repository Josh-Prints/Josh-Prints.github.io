<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — JoshPrints Admin</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<style>
  :root{
    --bg: #f6f8fa;
    --bg-raised: #ffffff;
    --ink: #1f2328;
    --ink-dim: #656d76;
    --accent: #0969da;
    --err: #cf222e;
    --ok: #1a7f37;
    --btn-hover-bg: #eef1f4;
    --btn-primary-hover: #0860ca;
    --warn: #9a6700;
    --border-tint: 31,35,40;
    --radius: 8px;
    --ok-subtle: rgba(26,127,55,0.1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0d1117;
      --bg-raised: #161b22;
      --ink: #e6edf3;
      --ink-dim: #8b949e;
      --accent: #4493f8;
      --err: #f85149;
      --ok: #3fb950;
      --btn-hover-bg: #21262d;
      --btn-primary-hover: #5aa6ff;
      --warn: #e3b341;
      --border-tint: 255,255,255;
      --ok-subtle: rgba(63,185,80,0.12);
    }
  }
  :root[data-theme="dark"]{
    --bg: #0d1117;
    --bg-raised: #161b22;
    --ink: #e6edf3;
    --ink-dim: #8b949e;
    --accent: #4493f8;
    --err: #f85149;
    --ok: #3fb950;
    --btn-hover-bg: #21262d;
    --btn-primary-hover: #5aa6ff;
    --warn: #e3b341;
    --border-tint: 255,255,255;
    --ok-subtle: rgba(63,185,80,0.12);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  }
  @keyframes fadeInDown{ from{ opacity:0; transform: translateY(-8px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(12px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes popIn{ from{ opacity:0; transform: scale(0.92);} to{ opacity:1; transform: scale(1);} }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  a, button, .btn{ transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s ease, box-shadow 0.15s, opacity 0.15s; }
  button:active, .btn:active{ transform: translateY(0) scale(0.96); }
  .login-card{ animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }

  #login-view{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card{
    background: var(--bg-raised); border:1px solid rgba(var(--border-tint),0.12);
    border-radius: var(--radius); padding: 32px; width: 320px;
  }
  .login-card h1{ font-size:19px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .login-card h1 .brand-text span{ color: var(--accent); }
  .logo-mark{ flex-shrink: 0; display:block; }
  .logo-loading{ flex-shrink: 0; display:block; }
  .logo-loading polygon{
    transform-box: fill-box;
    transform-origin: center;
    animation: facetGrow 3.6s ease-in-out infinite backwards;
  }
  @keyframes facetGrow{
    0%   { transform: scale(0.3); }
    30%  { transform: scale(1.15); }
    80%  { transform: scale(1.15); }
    100% { transform: scale(0.3); }
  }
  .login-card .sub{ color: var(--ink-dim); font-size:13px; margin: 0 0 20px; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%; box-sizing:border-box;
    background: var(--bg); color: var(--ink); border: 1px solid rgba(var(--border-tint),0.15);
    border-radius: 8px; padding: 12px; font-family: inherit;
    font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .google-btn:hover{ background: var(--bg-raised); border-color: rgba(var(--border-tint),0.3); }
  .google-btn svg{ flex-shrink:0; }
  .login-err{ display:none; color: var(--err); font-size:12.5px; margin-top:10px; }
  .login-err.show{ display:block; }

  #dash-view{ display:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 28px; border-bottom: 1px solid rgba(var(--border-tint),0.10);
    animation: fadeInDown 0.4s ease both;
    flex-wrap: wrap; gap: 12px;
  }
  .topbar h1{ font-size:19px; margin:0; display:flex; align-items:center; gap:8px; }
  .topbar h1 .brand-text span{ color: var(--accent); }
  .topbar .right{ display:flex; gap:10px; align-items:center; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
    font-size:13.5px; font-weight:600; border-radius:6px; cursor:pointer;
    border:1px solid rgba(var(--border-tint),0.15); background: var(--bg-raised); color: var(--ink);
    text-decoration:none; transition: background 0.15s, transform 0.15s;
  }
  .btn:hover{ background: var(--bg); transform: translateY(-1px); }
  .theme-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0;
    border:1px solid rgba(var(--border-tint),0.15); background: var(--bg-raised); color: var(--ink);
    font-size: 15px; cursor:pointer; line-height:1;
    transition: background 0.15s, transform 0.15s;
  }
  .theme-toggle-btn:hover{ background: var(--bg); transform: translateY(-1px); }

  .page{ max-width: 900px; margin:0 auto; padding: 24px 24px 80px; }

  .stats-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .stat-tile{
    flex:1; min-width:140px; background: var(--bg-raised); border:1px solid rgba(var(--border-tint),0.12);
    border-radius: var(--radius); padding: 14px 16px;
    opacity:0; transform: translateY(10px); animation: fadeInUp 0.4s ease both;
  }
  .stat-tile .num{ font-size:24px; font-weight:700; font-family: ui-monospace, monospace; }
  .stat-tile .label{ font-size:12px; color: var(--ink-dim); margin-top:2px; }

  .search-wrap{ margin-bottom:18px; }
  .search-wrap input{
    width:100%; padding:9px 12px; font-size:16px; border-radius:8px;
    border:1px solid rgba(var(--border-tint),0.18); background: var(--bg-raised); color: var(--ink);
    font-family: inherit;
  }
  .search-wrap input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.12); }

  .cust-list-spinner{ display:flex; align-items:center; justify-content:center; min-height:50vh; }
  .cust-list-spinner span{
    width:22px; height:22px; border-radius:50%;
    border:3px solid rgba(9,105,218,0.18); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  .cust-empty{ color: var(--ink-dim); font-size:13.5px; padding:30px 0; text-align:center; }

  .customer-card{
    background: var(--bg-raised); border:1px solid rgba(var(--border-tint),0.12); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px;
    opacity:0; transform: translateY(10px); animation: fadeInUp 0.35s ease both;
    transition: box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .customer-card:hover{ box-shadow: 0 4px 16px rgba(31,35,40,0.08); }
  .cust-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cust-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; background: var(--bg);
    object-fit: cover;
  }
  .cust-id{ flex:1; min-width:150px; }
  .cust-name{ font-weight:700; font-size:14.5px; }
  .cust-email{ font-size:12.5px; color: var(--ink-dim); }
  .cust-joined{ font-size:12px; color: var(--ink-dim); white-space:nowrap; }
  .cust-stats{ display:flex; gap:20px; margin-top:14px; flex-wrap:wrap; }
  .cust-stat .num{ font-size:16px; font-weight:700; font-family: ui-monospace, monospace; }
  .cust-stat .label{ font-size:11px; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.03em; }
  .cust-extra{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .chip{
    display:inline-flex; align-items:center; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:20px; background: var(--bg); color: var(--ink-dim);
    border: 1px solid rgba(var(--border-tint),0.12);
  }
  .chip.discount{ background: var(--ok-subtle); color: var(--ok); border-color: var(--ok-subtle); }
</style>
</head>

  (function(){
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function currentTheme(){
      const explicit = localStorage.getItem('theme');
      if (explicit) return explicit;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(mode){
      const isDark = mode === 'dark';
      toggle.textContent = isDark ? '☀️' : '🌙';
      toggle.setAttribute('aria-pressed', String(isDark));
    }
    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      document.documentElement.setAttribute('data-theme', next);
      applyTheme(next);
    });
    applyTheme(currentTheme());
  })();
</script>

    let lastDate = null;

      byStatus[o.status] = (byStatus[o.status] || 0) + 1;
      const amount = o.quote_amount ?? o.design_price ?? 0;
      value += Number(amount) || 0;
      if (!lastDate || o.created_at > lastDate) lastDate = o.created_at;
    });
    return { total: custOrders.length, byStatus, value, lastDate };
  }
