  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0; min-height: 100svh; display: flex; flex-direction: column;
    background: var(--canvas); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .topbar{ display: flex; align-items: center; justify-content: space-between; padding: 14px max(16px, calc((100% - 1040px) / 2)); border-bottom: 1px solid var(--border-muted); }
  .brand{ display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--fg); text-decoration: none; }
  .brand svg{ width: 28px; height: 28px; }
  .brand span span{ color: var(--accent); }
  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--border); background: var(--canvas-inset); color: var(--fg);
    transition: background .2s, border-color .2s, transform .15s ease, box-shadow .2s;
  }
  .btn:hover{ background: var(--btn-hover-bg); transform: translateY(-1px); }
  .btn-primary{ background: var(--accent); border-color: transparent; color: #fff; }
  .btn-primary:hover{ background: var(--btn-primary-hover); }
  .topbar .btn{ padding: 6px 16px; font-size: 14px; }

  main{ flex: 1; display: grid; place-items: center; padding: 32px 16px 56px; text-align: center; }
  .wrap{ max-width: 560px; }
  .broken{ width: min(220px, 56vw); height: auto; display: block; margin: 0 auto 8px; overflow: visible; }
  .broken polygon{ transform-box: fill-box; transform-origin: center; }
  .broken .lv{ transform: translate(var(--dx), var(--dy)) rotate(var(--r)); animation: hover 3.4s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -0.37s); opacity: .9; }
  @keyframes hover{
    from{ transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
    to{ transform: translate(var(--dx), calc(var(--dy) - 12px)) rotate(calc(var(--r) * -1)); }
  }
  .code{ font-size: clamp(64px, 18vw, 120px); font-weight: 700; line-height: 1; letter-spacing: -.04em; margin: 0; color: var(--accent); }
  h1{ font-size: clamp(22px, 4.6vw, 30px); font-weight: 600; letter-spacing: -.02em; margin: 10px 0 8px; }
  p{ color: var(--fg-muted); font-size: 16px; margin: 0 auto 26px; max-width: 440px; }
  .path{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--fg-muted); word-break: break-all; }
  .acts{ display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .subs{ display: flex; gap: 20px; justify-content: center; margin-top: 18px; font-size: 14px; }
  .subs a{ color: var(--fg-muted); text-decoration: none; }
  .subs a:hover{ color: var(--accent); }
  @media (max-width: 480px){ .acts{ flex-direction: column; } .acts .btn{ width: 100%; } }
  @media (prefers-reduced-motion: reduce){ .broken .lv{ animation: none; } }
