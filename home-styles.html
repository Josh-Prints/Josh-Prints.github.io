<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<title>Voxprints home styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ background:#0d1117; color:#e6edf3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; overflow-x:hidden; }
a{ color:inherit; text-decoration:none; }

/* ================= shared hero skeleton ================= */
.page{ display:none; } .page.on{ display:block; }
.hero{ position:relative; min-height:100svh; display:flex; flex-direction:column; overflow:hidden; padding-bottom:40px; isolation:isolate; }
.deco, .over{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.deco{ z-index:0; } .over{ z-index:5; }
.tb{ position:relative; z-index:3; display:flex; align-items:center; gap:14px; padding:14px max(16px, calc((100% - 1040px) / 2)); }
.brand{ display:flex; align-items:center; gap:9px; font-weight:600; font-size:16px; margin-right:auto; }
.brand .lg{ width:28px; height:28px; display:block; flex-shrink:0; }
.brand b{ font-weight:inherit; color:#4493f8; }
.tb nav{ display:flex; gap:4px; }
.tb nav a{ padding:6px 11px; font-size:14px; font-weight:500; opacity:.9; }
.cta{ padding:7px 16px; border-radius:8px; font-size:14px; font-weight:600; background:#4493f8; color:#fff; }
.content{ position:relative; z-index:2; flex:1; display:flex; align-items:center; justify-content:center; padding:28px 16px 40px; }
.core{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; max-width:860px; width:100%; }
.pill{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:500; margin-bottom:22px; }
h1{ margin:0 0 18px; font-size:clamp(36px, 6vw, 64px); line-height:1.1; font-weight:600; letter-spacing:-.02em; }
h1 > span{ display:block; }
.core p{ max-width:560px; margin:0 auto 28px; font-size:17px; line-height:1.6; }
.acts{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.acts a{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 22px; border-radius:8px; font-weight:600; font-size:15px; border:1px solid transparent; transition:transform .2s ease, box-shadow .2s ease, background .2s ease; }
.acts a .ar{ width:16px; height:16px; transition:transform .25s ease; }
.acts a:hover .ar{ transform:translateX(4px); }
.subs{ display:flex; gap:22px; margin-top:16px; font-size:13.5px; }
.subs a{ opacity:.7; } .subs a:hover{ opacity:1; }
@media (max-width:760px){ .tb nav{ display:none; } }
@media (max-width:600px){
  .acts{ flex-direction:column; align-items:stretch; width:100%; }
  .core p{ font-size:16px; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes floaty{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(var(--fx,30px), var(--fy,-40px)) scale(var(--fs,1.08)); } }

/* ================= viewer bar ================= */
.vbar{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:100; display:flex; align-items:center; gap:6px; padding:6px; border-radius:14px; background:rgba(13,17,23,.82); border:1px solid rgba(255,255,255,.14); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 10px 30px rgba(0,0,0,.45); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#e6edf3; max-width:calc(100% - 16px); }
.vbar button, .vbar select{ font:inherit; color:inherit; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:10px; height:38px; cursor:pointer; }
.vbar button{ width:40px; font-size:20px; line-height:1; }
.vbar .back{ display:grid; place-items:center; width:40px; height:38px; border-radius:10px; font-size:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); }
.vbar button:hover{ background:rgba(255,255,255,.16); }
.vbar select{ padding:0 10px; font-size:14px; font-weight:600; min-width:0; max-width:52vw; }
.vbar .when{ font-size:12px; color:#9aa4b2; padding:0 8px 0 4px; white-space:nowrap; }
.vbar #today{ width:auto; padding:0 12px; font-size:13px; font-weight:600; }
@media (max-width:480px){ .vbar .when{ display:none; } }

/* ================= 1. Particles ================= */
.s-particles{ background:radial-gradient(1100px 700px at 50% 25%, #13233f, #0d1117 70%); color:#e6edf3; }
.s-particles canvas{ position:absolute; inset:0; width:100%; height:100%; }
.s-particles .pill{ color:#4493f8; background:rgba(68,147,248,.1); border:1px solid rgba(68,147,248,.35); }
.s-particles .l2{ color:#4493f8; }
.s-particles p{ color:#8b949e; }
.s-particles .b1{ background:#4493f8; color:#fff; box-shadow:0 8px 26px rgba(68,147,248,.35); }
.s-particles .b2{ border-color:#4493f8; color:#4493f8; background:rgba(13,17,23,.5); }

/* ================= 3. Holographic ================= */
.s-holo{ background:#07070d; color:#f2f4ff; --holo:linear-gradient(110deg,#9ec5ff,#e0b3ff 18%,#ffb8e6 34%,#fff1b8 50%,#b8ffe3 66%,#9ec5ff 82%,#e0b3ff); }
.s-holo .hb{ position:absolute; inset:-35%; background:conic-gradient(from 0deg,#4493f8,#b06cff,#ff7ad9,#ffd36e,#6effc8,#4493f8); filter:blur(90px) saturate(1.3); opacity:.3; animation:spin 28s linear infinite; }
.s-holo .foil{ position:absolute; inset:0; background:repeating-linear-gradient(115deg, transparent 0 10px, rgba(255,255,255,.035) 10px 11px); }
.s-holo .card{ position:absolute; width:min(560px,86vw); height:min(340px,52vw); left:50%; top:52%; transform:translate(-50%,-50%) rotateX(18deg) rotateZ(-6deg); border-radius:26px; background:var(--holo); background-size:300% 100%; opacity:.12; animation:slide 7s linear infinite; filter:blur(2px); }
.s-holo .pill, .s-holo .b2{ border:1px solid transparent; background:linear-gradient(#0c0c14,#0c0c14) padding-box, var(--holo) border-box; background-size:100% 100%, 300% 100%; animation:slide 7s linear infinite; }
.s-holo .pill{ color:#e6dcff; }
.s-holo .l2, .s-holo .brand b{ background:var(--holo); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:slide 7s linear infinite; }
.s-holo h1{ font-weight:700; }
.s-holo p{ color:#b7b9cc; }
.s-holo .b1, .s-holo .cta{ background:var(--holo); background-size:300% 100%; color:#14121f; animation:slide 7s linear infinite; box-shadow:0 8px 30px rgba(224,179,255,.25); }
.s-holo .b2{ color:#f2f4ff; }

/* ================= 4. Neon glow ================= */
.s-neon{ background:radial-gradient(900px 520px at 50% 42%, #0c1426, #03040a 72%); color:#e9f3ff; }
.s-neon .wall{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size:64px 32px; }
.s-neon .floorglow{ position:absolute; left:10%; right:10%; bottom:-80px; height:220px; background:radial-gradient(closest-side, rgba(68,147,248,.35), transparent); filter:blur(20px); }
.s-neon .core{ padding:44px 36px 38px; }
.s-neon .core::before{ content:""; position:absolute; inset:0; border:2px solid #cfe6ff; border-radius:30px; box-shadow:0 0 6px #4493f8, 0 0 22px #4493f8, 0 0 48px rgba(68,147,248,.6), inset 0 0 8px #4493f8, inset 0 0 26px rgba(68,147,248,.4); animation:neonOn 7s infinite; pointer-events:none; }
.s-neon .l1{ color:#fff; text-shadow:0 0 4px #fff, 0 0 12px #4493f8, 0 0 30px #4493f8, 0 0 64px #4493f8; }
.s-neon .l2{ color:#e0fbff; text-shadow:0 0 4px #fff, 0 0 14px #2ee6ff, 0 0 34px #2ee6ff, 0 0 72px #2ee6ff; animation:flicker 6s infinite; }
@keyframes flicker{ 0%,17%,21%,24%,52%,56%,100%{ opacity:1; } 19%,23%,54%{ opacity:.3; } }
@keyframes neonOn{ 0%,88%,92%,100%{ opacity:1; } 90%{ opacity:.55; } }
.s-neon h1{ font-weight:500; letter-spacing:0; }
.s-neon .pill{ color:#bfe9ff; border:1.5px solid #9fdcff; box-shadow:0 0 10px rgba(46,230,255,.55), inset 0 0 8px rgba(46,230,255,.35); text-shadow:0 0 8px #2ee6ff; }
.s-neon p{ color:#9fb2cc; }
.s-neon .b1{ border:2px solid #cfe6ff; color:#fff; text-shadow:0 0 8px #4493f8; box-shadow:0 0 10px #4493f8, 0 0 28px rgba(68,147,248,.6), inset 0 0 12px rgba(68,147,248,.5); }
.s-neon .b2{ border:2px solid #9ff3ff; color:#d8fbff; text-shadow:0 0 8px #2ee6ff; box-shadow:0 0 10px rgba(46,230,255,.6), inset 0 0 10px rgba(46,230,255,.35); }
.s-neon .cta{ background:transparent; border:1.5px solid #cfe6ff; box-shadow:0 0 12px #4493f8; text-shadow:0 0 6px #4493f8; }
.s-neon .brand b{ color:#9fd0ff; text-shadow:0 0 10px #4493f8; }

/* ================= 5. Wireframe 3D ================= */
.s-wire{ background:#04070e; color:#dbe7ff; }
.s-wire .floor{ position:absolute; left:-50%; right:-50%; bottom:0; height:55%; background-image:linear-gradient(rgba(68,147,248,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(68,147,248,.55) 1px, transparent 1px); background-size:60px 60px; transform:perspective(420px) rotateX(68deg); transform-origin:50% 100%; animation:floorMove 3s linear infinite; -webkit-mask-image:linear-gradient(to top, #000 15%, transparent 90%); mask-image:linear-gradient(to top, #000 15%, transparent 90%); }
@keyframes floorMove{ to{ background-position:0 60px; } }
.s-wire .scene{ position:absolute; left:50%; top:44%; width:300px; height:300px; margin:-150px 0 0 -150px; perspective:900px; opacity:.38; }
.s-wire .cube{ position:absolute; inset:0; transform-style:preserve-3d; animation:cubeRot 22s linear infinite; }
.s-wire .cube.in{ inset:75px; animation-duration:14s; animation-direction:reverse; }
.s-wire .cube i{ position:absolute; inset:0; border:1.5px solid #7fb6ff; box-shadow:inset 0 0 24px rgba(68,147,248,.18); }
.s-wire .cube i:nth-child(1){ transform:translateZ(150px); } .s-wire .cube i:nth-child(2){ transform:rotateY(180deg) translateZ(150px); }
.s-wire .cube i:nth-child(3){ transform:rotateY(90deg) translateZ(150px); } .s-wire .cube i:nth-child(4){ transform:rotateY(-90deg) translateZ(150px); }
.s-wire .cube i:nth-child(5){ transform:rotateX(90deg) translateZ(150px); } .s-wire .cube i:nth-child(6){ transform:rotateX(-90deg) translateZ(150px); }
.s-wire .cube.in i:nth-child(1){ transform:translateZ(75px); } .s-wire .cube.in i:nth-child(2){ transform:rotateY(180deg) translateZ(75px); }
.s-wire .cube.in i:nth-child(3){ transform:rotateY(90deg) translateZ(75px); } .s-wire .cube.in i:nth-child(4){ transform:rotateY(-90deg) translateZ(75px); }
.s-wire .cube.in i:nth-child(5){ transform:rotateX(90deg) translateZ(75px); } .s-wire .cube.in i:nth-child(6){ transform:rotateX(-90deg) translateZ(75px); }
@keyframes cubeRot{ from{ transform:rotateX(-24deg) rotateY(0); } to{ transform:rotateX(-24deg) rotateY(360deg); } }
.s-wire h1{ font-weight:300; letter-spacing:.01em; text-shadow:0 0 30px rgba(4,7,14,.9); }
.s-wire .l2{ color:#7fb6ff; font-weight:600; }
.s-wire .pill{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; color:#7fb6ff; border:1px solid rgba(127,182,255,.5); border-radius:4px; background:rgba(4,7,14,.6); }
.s-wire p{ color:#8fa3c4; }
.s-wire .acts a{ border-radius:4px; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:14px; }
.s-wire .b1{ background:#4493f8; color:#04070e; }
.s-wire .b2{ border-color:#7fb6ff; color:#bcd8ff; background:rgba(4,7,14,.6); }
.s-wire .cta{ border-radius:4px; }

/* ================= 6. Glassmorphism ================= */
.s-glass{ background:#0a1024; color:#fff; }
.s-glass .orb{ position:absolute; border-radius:50%; filter:blur(36px); animation:floaty var(--d,12s) ease-in-out infinite alternate; }
.s-glass .orb:nth-child(1){ width:520px; height:520px; left:-140px; top:-120px; background:#2f6bff; --fx:120px; --fy:80px; }
.s-glass .orb:nth-child(2){ width:420px; height:420px; right:-120px; top:12%; background:#8a5cff; --fx:-100px; --fy:120px; --d:14s; }
.s-glass .orb:nth-child(3){ width:360px; height:360px; left:28%; bottom:-140px; background:#16c2d8; --fx:80px; --fy:-90px; --d:10s; }
.s-glass .tb{ margin:12px auto 0; width:min(1040px, calc(100% - 24px)); padding:10px 14px; border-radius:16px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.s-glass .core{ padding:46px 38px 40px; border-radius:30px; background:linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.24); -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%); box-shadow:0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); max-width:760px; }
.s-glass .pill{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); }
.s-glass .l2, .s-glass .brand b{ color:#a9cbff; }
.s-glass p{ color:rgba(255,255,255,.78); }
.s-glass .acts a{ border-radius:14px; }
.s-glass .b1{ background:#fff; color:#0a1024; }
.s-glass .b2{ background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.3); }
.s-glass .cta{ border-radius:12px; background:rgba(255,255,255,.9); color:#0a1024; }
@media (max-width:600px){ .s-glass .core{ padding:30px 18px; } }

/* ================= 7. Kinetic type ================= */
.s-kinetic{ background:#0d1117; color:#e6edf3; }
.s-kinetic .marq{ position:absolute; inset:-20%; display:flex; flex-direction:column; justify-content:center; gap:2px; opacity:.08; transform:rotate(-8deg); }
.s-kinetic .marq div{ white-space:nowrap; font-size:clamp(56px,10vw,120px); font-weight:900; text-transform:uppercase; letter-spacing:-.02em; line-height:1; animation:mq 40s linear infinite; }
.s-kinetic .marq div:nth-child(even){ animation-direction:reverse; color:transparent; -webkit-text-stroke:2px #e6edf3; }
@keyframes mq{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.s-kinetic h1{ font-weight:800; letter-spacing:-.03em; font-size:clamp(40px,7vw,80px); }
.s-kinetic .ch{ display:inline-block; animation:rise .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 32ms); }
.s-kinetic .l2 .ch{ color:#4493f8; animation:rise .9s cubic-bezier(.2,.8,.2,1) both, wave 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * 32ms), calc(1.4s + var(--i) * 70ms); }
@keyframes rise{ from{ transform:translateY(80%) rotate(10deg); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes wave{ 0%,100%{ transform:none; } 40%{ transform:translateY(-10px); } }
.s-kinetic .pill{ background:#4493f8; color:#fff; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:11px; }
.s-kinetic p{ color:#8b949e; }
.s-kinetic .b1{ background:#e6edf3; color:#0d1117; }
.s-kinetic .b2{ border-color:#e6edf3; color:#e6edf3; }

/* ================= 8. Isometric ================= */
.s-iso{ background:#0c1220; color:#e6edf3; }
.s-iso .grid{ position:absolute; inset:-20%; background-image:repeating-linear-gradient(30deg, rgba(68,147,248,.13) 0 1px, transparent 1px 40px), repeating-linear-gradient(150deg, rgba(68,147,248,.13) 0 1px, transparent 1px 40px); -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent); mask-image:radial-gradient(closest-side, #000 30%, transparent); }
.s-iso svg.stack{ position:absolute; width:min(380px,48vw); overflow:visible; opacity:.9; }
.s-iso svg.stack.a{ left:2%; bottom:12%; } .s-iso svg.stack.b{ right:2%; top:16%; width:min(300px,38vw); }
.s-iso .ic{ animation:drop 7s cubic-bezier(.3,1.4,.5,1) infinite; animation-delay:calc(var(--i) * .22s); }
@keyframes drop{ 0%{ transform:translateY(-60px); opacity:0; } 8%,80%{ transform:none; opacity:1; } 92%,100%{ transform:none; opacity:0; } }
.s-iso h1{ font-weight:800; }
.s-iso .l1{ text-shadow:1px 1px 0 #1d3f78, 2px 2px 0 #1d3f78, 3px 3px 0 #1d3f78, 4px 4px 0 #1d3f78, 5px 5px 0 #15305d; }
.s-iso .l2{ color:#79b4ff; text-shadow:1px 1px 0 #1b4fa8, 2px 2px 0 #1b4fa8, 3px 3px 0 #1b4fa8, 4px 4px 0 #153f86; }
.s-iso .core{ background:rgba(12,18,32,.6); padding:26px; border-radius:20px; }
.s-iso .pill{ background:#162238; color:#79b4ff; box-shadow:0 4px 0 #0a1528; border-radius:8px; }
.s-iso p{ color:#93a1b8; }
.s-iso .b1{ background:#4493f8; color:#fff; box-shadow:0 6px 0 #2a5fb8; }
.s-iso .b2{ background:#1a2740; color:#cfe1ff; box-shadow:0 6px 0 #0d1830; }
.s-iso .acts a:active{ transform:translateY(5px); box-shadow:0 1px 0 #2a5fb8; }

/* ================= 10. ASCII art ================= */
.s-ascii{ background:#04060a; color:#cfe3ff; font-family:"VT323", ui-monospace, monospace; }
.s-ascii pre.field{ position:absolute; inset:0; margin:0; font:12px/12px ui-monospace, Menlo, monospace; color:#4493f8; opacity:.32; white-space:pre; overflow:hidden; }
.s-ascii .core{ background:rgba(4,6,10,.82); padding:28px 26px; border:1px solid rgba(68,147,248,.4); box-shadow:0 0 0 6px rgba(4,6,10,.82), 0 0 0 7px rgba(68,147,248,.25); }
.s-ascii .tb{ font-family:"VT323", monospace; font-size:20px; }
.s-ascii .brand{ font-size:24px; font-weight:400; }
.s-ascii .tb nav a{ font-size:20px; }
.s-ascii .cta{ border-radius:0; font-size:20px; font-weight:400; color:#04060a; padding:2px 14px; }
.s-ascii h1{ font-family:"VT323", monospace; font-weight:400; font-size:clamp(46px, 8.5vw, 92px); letter-spacing:0; line-height:.92; }
.s-ascii .l2{ color:#4493f8; }
.s-ascii .l2::after{ content:"\2588"; animation:blink 1s steps(1) infinite; margin-left:.08em; }
@keyframes blink{ 50%{ opacity:0; } }
.s-ascii .pill{ border:1px dashed #4493f8; border-radius:0; font-size:19px; color:#4493f8; padding:2px 12px; }
.s-ascii .pill::before{ content:">"; }
.s-ascii p{ font-size:21px; line-height:1.25; color:#8fa6c8; }
.s-ascii .acts a{ border-radius:0; font-size:22px; font-weight:400; padding:6px 18px; }
.s-ascii .acts a::before{ content:"["; } .s-ascii .acts a::after{ content:"]"; }
.s-ascii .b1{ background:#4493f8; color:#04060a; }
.s-ascii .b2{ border-color:#4493f8; color:#4493f8; }
.s-ascii .subs{ font-size:19px; }

/* ================= 11. Gradient mesh ================= */
.s-mesh{ background:#0b0f24; color:#fff; }
.s-mesh .m{ position:absolute; width:70vmax; height:70vmax; border-radius:50%; filter:blur(60px); mix-blend-mode:screen; opacity:.75; animation:floaty var(--d,16s) ease-in-out infinite alternate; }
.s-mesh .m:nth-child(1){ background:#2f6bff; left:-25vmax; top:-30vmax; --fx:20vmax; --fy:15vmax; }
.s-mesh .m:nth-child(2){ background:#7c4dff; right:-30vmax; top:-25vmax; --fx:-15vmax; --fy:20vmax; --d:19s; }
.s-mesh .m:nth-child(3){ background:#00b8c7; left:-20vmax; bottom:-40vmax; --fx:25vmax; --fy:-10vmax; --d:14s; }
.s-mesh .m:nth-child(4){ background:#ff5fa2; right:-30vmax; bottom:-45vmax; --fx:-20vmax; --fy:-15vmax; --d:21s; opacity:.45; }
.s-mesh .grain{ position:absolute; inset:0; opacity:.22; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.s-mesh h1{ font-weight:700; letter-spacing:-.03em; }
.s-mesh .l2{ font-family:Georgia, "Times New Roman", serif; font-style:italic; font-weight:400; letter-spacing:-.01em; }
.s-mesh .pill{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.s-mesh p{ color:rgba(255,255,255,.8); }
.s-mesh .acts a{ border-radius:999px; }
.s-mesh .b1{ background:#fff; color:#0b0f24; }
.s-mesh .b2{ border-color:rgba(255,255,255,.5); color:#fff; }
.s-mesh .cta{ border-radius:999px; background:#fff; color:#0b0f24; }
.s-mesh .brand b{ color:#cfe0ff; }

/* ================= 13. Split-flap ================= */

function isoStack(cells){
  const a = 26, c = a * 0.866;
  const sorted = cells.slice().sort((p, q) => (p[0] + p[1] + p[2] * 2) - (q[0] + q[1] + q[2] * 2));
  const g = sorted.map(([x, y, z], i) => {
    const sx = (x - y) * c, sy = (x + y) * a / 2 - z * a;
    return `<g class="ic" style="--i:${i}"><g transform="translate(${sx.toFixed(1)},${sy.toFixed(1)})">
      <polygon points="0,${-a} ${c},${-a / 2} 0,0 ${-c},${-a / 2}" fill="#79b4ff"/>
      <polygon points="${-c},${-a / 2} 0,0 0,${a} ${-c},${a / 2}" fill="#3f86ef"/>
      <polygon points="0,0 ${c},${-a / 2} ${c},${a / 2} 0,${a}" fill="#2a5fb8"/></g></g>`;
  }).join('');
  return `<svg class="stack" viewBox="-140 -130 280 230">${g}</svg>`;
}

/* ---------- per-style live bits (only the visible style runs) ---------- */
const RUN = {
  particles(sec){
    const cv = sec.querySelector('canvas'), ctx = cv.getContext('2d');
    let w, h, dpr, pts = [], raf, mouse = { x:-9999, y:-9999 };
    function size(){
      dpr = Math.min(2, devicePixelRatio || 1); w = sec.clientWidth; h = sec.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(130, Math.round(w * h / 9000));
      pts = Array.from({ length:n }, () => ({ x:Math.random() * w, y:Math.random() * h, vx:(Math.random() - .5) * .45, vy:(Math.random() - .5) * .45, r:Math.random() * 1.6 + .6 }));
    }
    function frame(){
      ctx.clearRect(0, 0, w, h);
      for (const p of pts){
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 120){ p.x += dx / d * 1.2; p.y += dy / d * 1.2; }
      }
      for (let i = 0; i < pts.length; i++){
        for (let j = i + 1; j < pts.length; j++){
          const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 120){ ctx.strokeStyle = `rgba(68,147,248,${(1 - d / 120) * .45})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        }
      }
      ctx.fillStyle = '#8cc0ff';
      for (const p of pts){ ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
      raf = requestAnimationFrame(frame);
    }
    const mv = e => { const r = sec.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; };
    const lv = () => { mouse.x = mouse.y = -9999; };
    size(); frame(); addEventListener('resize', size); sec.addEventListener('pointermove', mv); sec.addEventListener('pointerleave', lv);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); sec.removeEventListener('pointermove', mv); sec.removeEventListener('pointerleave', lv); };
  },
  kinetic(sec){
    sec.querySelectorAll('h1 > span').forEach(line => {
      const text = line.dataset.t || (line.dataset.t = line.textContent);
      let i = 0;
      line.innerHTML = text.split(' ').map(w => `<span style="display:inline-block;white-space:nowrap">${[...w].map(c => `<span class="ch" style="--i:${i++}">${c}</span>`).join('')}</span>`).join(' ');
    });
  },
  ascii(sec){
    const pre = sec.querySelector('pre.field'), chars = ' .:-=+*#%@';
    let t = 0;
    const tick = () => {
      const cols = Math.ceil(sec.clientWidth / 7.2), rows = Math.ceil(sec.clientHeight / 12);
      let out = '';
      for (let y = 0; y < rows; y++){
        for (let x = 0; x < cols; x++){
          const v = Math.sin(x * .11 + t) + Math.sin(y * .19 - t * 1.3) + Math.sin((x + y) * .06 + t * .7);
          out += chars[Math.max(0, Math.min(9, Math.floor((v + 3) / 6 * 10)))];
        }
        out += '\n';
      }
      pre.textContent = out; t += .12;
    };
    tick(); const id = setInterval(tick, 90);
    return () => clearInterval(id);
  },
  flap(sec){
    const POOL = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const tiles = [];
    sec.querySelectorAll('h1 > span').forEach(line => {
      const text = (line.dataset.t || (line.dataset.t = line.textContent)).toUpperCase();
      line.innerHTML = text.split(' ').map(word => `<span class="word">${[...word].map(c => `<span class="tile" data-c="${c}"> </span>`).join('')}</span>`).join('');
      line.querySelectorAll('.tile').forEach(t => tiles.push(t));
    });
    let timers = [];
    function run(){
      timers.forEach(clearInterval); timers = [];
      tiles.forEach((tile, i) => {
        let steps = 8 + i * 2 + Math.floor(Math.random() * 6);
        const id = setInterval(() => {
          steps--;
          tile.textContent = steps <= 0 ? tile.dataset.c : POOL[Math.floor(Math.random() * POOL.length)];
          tile.classList.remove('f'); void tile.offsetWidth; tile.classList.add('f');
          if (steps <= 0) clearInterval(id);
        }, 55);
        timers.push(id);
      });
    }
    run(); const loop = setInterval(run, 10000);
    return () => { clearInterval(loop); timers.forEach(clearInterval); };
  },
  vhs(sec){
    const tc = sec.querySelector('.tc'), t0 = Date.now();
    const id = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      tc.textContent = `SP ${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 500);
    return () => clearInterval(id);
  },
};

/* ---------- viewer ---------- */
const stage = document.getElementById('stage'), pick = document.getElementById('pick'), when = document.getElementById('when');
stage.innerHTML = STYLES.map(pageHTML).join('');
const pages = [...stage.querySelectorAll('.page')];
const sections = pages.map(p => p.querySelector('.hero'));
const revealIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { threshold:.12, rootMargin:'0px 0px -30px 0px' }) : null;
function observeReveals(root){ root.querySelectorAll('[data-r]:not(.in)').forEach(el => revealIO ? revealIO.observe(el) : el.classList.add('in')); }
observeReveals(stage);
STYLES.forEach((s, i) => pick.add(new Option(`${i + 1}. ${s.name}`, i)));

// which style is "today": cycles through the list in order, one per day
const DAY0 = Date.UTC(2026, 0, 1);
function dayIndex(d){ return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DAY0) / 864e5); }
const todayIdx = ((dayIndex(new Date()) % STYLES.length) + STYLES.length) % STYLES.length;

let cur = -1, stop = null;
function show(i){
  i = (i + STYLES.length) % STYLES.length;
  if (stop){ stop(); stop = null; }
  pages.forEach((s, k) => s.classList.toggle('on', k === i));
  cur = i; pick.value = i;
  const fn = RUN[STYLES[i].id]; if (fn) stop = fn(sections[i]) || null;
  const ahead = (i - todayIdx + STYLES.length) % STYLES.length;
  if (ahead === 0) when.textContent = 'Shows today';
  else {
    const d = new Date(); d.setDate(d.getDate() + ahead);
    when.textContent = 'Shows ' + d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  }
  history.replaceState(null, '', '#' + STYLES[i].id);
  scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('today').onclick = () => show(todayIdx);
pick.onchange = () => show(+pick.value);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let tx = null, ty = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
stage.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
  tx = null;
});
stage.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });
const fromHash = STYLES.findIndex(s => s.id === location.hash.slice(1));
show(fromHash >= 0 ? fromHash : todayIdx);
