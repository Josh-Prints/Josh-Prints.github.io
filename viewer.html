<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model preview — JoshPrints</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{
    --bg: #f6f8fa;
    --ink: #1f2328;
    --ink-dim: #656d76;
    --accent: #0969da;
    --border: rgba(31,35,40,0.12);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; overflow:hidden; }

  @keyframes fadeInDown{ from{ opacity:0; transform: translateY(-8px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn{ from{ opacity:0; transform: scale(0.94); } to{ opacity:1; transform: scale(1); } }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  #topbar{
    height: 48px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 16px;
    background:#ffffff;
    border-bottom: 1px solid var(--border);
    animation: fadeInDown 0.4s ease both;
  }
  #fname-wrap{
    display:flex; align-items:center; gap:8px; min-width:0; perspective: 400px;
  }
  .logo-mark{ flex-shrink: 0; display:block; animation: logoSpin 5s linear infinite; transform-style: preserve-3d; }
  @keyframes logoSpin{ from{ transform: rotateY(0deg); } to{ transform: rotateY(360deg); } }
  #fname-wrap:hover .logo-mark{ animation-duration: 0.7s; }
  #fname{
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  }
  #download-link{
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 5px 12px;
    white-space: nowrap;
    margin-left: 12px;
    transition: background 0.2s, transform 0.15s ease, box-shadow 0.2s;
    display: inline-block;
  }
  #download-link:hover{ background: rgba(9,105,218,0.08); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(9,105,218,0.18); }
  #download-link:active{ transform: translateY(0) scale(0.96); }

  #viewport{ position: absolute; top: 48px; left:0; right:0; bottom:0; opacity: 0; transition: opacity 0.5s ease; }
  #viewport.ready{ opacity: 1; }
  #viewport canvas{ display:block; }

  #loading, #error{
    position: absolute; top: 48px; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 10px;
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    text-align: center;
    padding: 24px;
    animation: fadeIn 0.3s ease both;
    transition: opacity 0.3s ease;
  }
  #error{ display:none; }
  #error a{ color: var(--accent); transition: opacity 0.15s; }
  #error a:hover{ opacity: 0.7; }

  .spinner{
    width: 22px; height:22px; border-radius:50%;
    border: 3px solid rgba(9,105,218,0.2);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #hint{
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
    font-size: 11px; color: var(--ink-dim);
    background: rgba(255,255,255,0.85);
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
    pointer-events: none;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both, bob 2.4s ease-in-out 0.6s infinite;
  }
</style>
</head>
<body>

  <div id="topbar">
    <div id="fname-wrap">
      <img src="logo.svg" alt="" width="18" height="18" class="logo-mark">
      <div id="fname">Model preview</div>
    </div>
    <a id="download-link" href="#">⇩ Download original</a>
  </div>

  <div id="viewport"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Loading model…</div>
  </div>

  <div id="error">
    <div>Preview isn't available for this file type.</div>
    <div><a id="error-download" href="#">Download the file</a> to view it in your slicer or CAD software.</div>
  </div>

  <div id="hint" style="display:none;">Drag to rotate · Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { STLLoader } from 'three/addons/loaders/STLLoader.js';
  import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
  import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

  const params = new URLSearchParams(window.location.search);
  const url = params.get('url');
  const name = params.get('name') || 'model';
  const ext = (name.split('.').pop() || '').toLowerCase();

  document.title = `${name} — JoshPrints`;
  document.getElementById('fname').textContent = name;
  if (url){
    document.getElementById('download-link').href = url;
    document.getElementById('error-download').href = url;
  }

  const SUPPORTED = ['stl', 'obj', '3mf'];

  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const hintEl = document.getElementById('hint');

  function showError(){
    loadingEl.style.opacity = '0';
    setTimeout(() => { loadingEl.style.display = 'none'; }, 250);
    errorEl.style.display = 'flex';
  }

  if (!url || !SUPPORTED.includes(ext)){
    showError();
  } else {
    initViewer();
  }

  function initViewer(){
    const viewport = document.getElementById('viewport');
    const width = () => viewport.clientWidth;
    const height = () => viewport.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6f8fa);

    const camera = new THREE.PerspectiveCamera(45, width() / height(), 0.1, 10000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width(), height());
    viewport.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.1));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(1, 1.5, 1);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight2.position.set(-1, -0.5, -1);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const material = new THREE.MeshStandardMaterial({ color: 0x0969da, metalness: 0.15, roughness: 0.55 });

    function frameObject(obj){
      // STL/OBJ/3MF files coming from CAD & slicer software are conventionally
      // Z-up, but three.js's world is Y-up — without this the model renders
      // lying on its side. Rotate -90° around X to bring Z-up into Y-up.
      obj.rotation.x = -Math.PI / 2;

      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      obj.position.sub(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const dist = maxDim * 1.8;
      camera.position.set(dist, dist * 0.8, dist);
      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();

      scene.add(obj);
      loadingEl.style.opacity = '0';
      setTimeout(() => { loadingEl.style.display = 'none'; }, 250);
      document.getElementById('viewport').classList.add('ready');
      hintEl.style.display = 'block';
    }

    if (ext === 'stl'){
      new STLLoader().load(url, geometry => {
        geometry.computeVertexNormals();
        frameObject(new THREE.Mesh(geometry, material));
      }, undefined, showError);
    } else if (ext === 'obj'){
      new OBJLoader().load(url, obj => {
        obj.traverse(child => { if (child.isMesh) child.material = material; });
        frameObject(obj);
      }, undefined, showError);
    } else if (ext === '3mf'){
      new ThreeMFLoader().load(url, obj => {
        obj.traverse(child => { if (child.isMesh && !child.material) child.material = material; });
        frameObject(obj);
      }, undefined, showError);
    }

    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = width() / height();
      camera.updateProjectionMatrix();
      renderer.setSize(width(), height());
    });
  }
</script>

</body>
</html>
