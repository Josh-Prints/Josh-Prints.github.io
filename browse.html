<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse presets — JoshPrints</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{
    --canvas: #ffffff;
    --canvas-inset: #f6f8fa;
    --border: #d1d9e0;
    --border-muted: #d8dee4;
    --fg: #1f2328;
    --fg-muted: #59636e;
    --accent: #0969da;
    --btn-primary-hover: #0860ca;
    --btn-hover-bg: #f3f4f6;
    --ok: #1a7f37;
    --err: #cf222e;
    --border-tint: 31,35,40;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas: #0d1117;
      --canvas-inset: #161b22;
      --border: #30363d;
      --border-muted: #21262d;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --accent: #4493f8;
      --btn-primary-hover: #5aa6ff;
      --btn-hover-bg: #21262d;
      --ok: #3fb950;
      --err: #f85149;
      --border-tint: 255,255,255;
    }
  }
  :root[data-theme="dark"]{
    --canvas: #0d1117;
    --canvas-inset: #161b22;
    --border: #30363d;
    --border-muted: #21262d;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --accent: #4493f8;
    --btn-primary-hover: #5aa6ff;
    --btn-hover-bg: #21262d;
    --ok: #3fb950;
    --err: #f85149;
    --border-tint: 255,255,255;
  }
  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    background: var(--canvas);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  @keyframes fadeInDown{ from{ opacity:0; transform: translateY(-10px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes popIn{ from{ opacity:0; transform: scale(0.94); } to{ opacity:1; transform: scale(1); } }
  @keyframes settleIn{ from{ opacity:0; transform: scale(0.97); } to{ opacity:1; transform: scale(1); } }
  @keyframes shimmer{ 0%{ background-position: -200% 0; } 100%{ background-position: 200% 0; } }
    @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .topbar{
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border-muted);
    animation: fadeInDown 0.5s ease both;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; color:var(--fg); text-decoration:none; }
  .logo-mark{ flex-shrink: 0; display:block; }
  .logo-loading{ flex-shrink: 0; display:block; }
  .logo-loading polygon{
    transform-box: fill-box;
    transform-origin: center;
    animation: facetGrow 3.6s ease-in-out infinite backwards;
  }
  @keyframes facetGrow{
    0%   { transform: scale(0.55); }
    30%  { transform: scale(1); }
    80%  { transform: scale(1); }
    100% { transform: scale(0.55); }
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 5px 16px; font-size:14px; font-weight:500; line-height:20px;
    border-radius:6px; border:1px solid var(--border); background: var(--canvas-inset); color:var(--fg);
    text-decoration:none; cursor:pointer; transition: background 0.2s, transform 0.15s ease;
  }
  .btn:hover{ background: var(--btn-hover-bg); border-color: var(--border-muted); box-shadow: 0 3px 10px rgba(31,35,40,0.08); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0) scale(0.97); }
  .btn-primary{ background: var(--accent); border-color: rgba(31,35,40,0.15); color:#fff; }
  .btn-primary:hover{ background: var(--btn-primary-hover); box-shadow: 0 4px 14px rgba(9,105,218,0.35); }
  .theme-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0;
    border: 1px solid var(--border); background: var(--canvas-inset); color: var(--fg);
    font-size: 15px; cursor:pointer; line-height:1;
    transition: background 0.2s, border-color 0.2s, transform 0.15s ease;
  }
  .theme-toggle-btn:hover{ background: var(--btn-hover-bg); border-color: var(--border-muted); transform: translateY(-1px); }
  .google-btn{
    display:flex; align-items:center; gap:8px;
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--canvas-inset); color: var(--fg); font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor:pointer; transition: background 0.15s, border-color 0.15s;
  }
  .google-btn:hover{ background: var(--btn-hover-bg); }
  .google-btn svg{ flex-shrink:0; }
  .account-chip{
    display:none; align-items:center; gap:8px;
  }
  .account-chip img{ width:28px; height:28px; border-radius:50%; flex-shrink:0; background: var(--canvas-inset); }
  .account-chip .name{ font-size:13.5px; font-weight:600; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-signout-btn{
    background:none; border:none; color: var(--fg-muted); font-size:11.5px; cursor:pointer;
    text-decoration:underline; padding:0; font-family:inherit;
  }
  .account-modal-overlay{
    position: fixed; inset:0; background: rgba(31,35,40,0.4);
    display:flex; align-items:center; justify-content:center; padding: 20px;
    z-index: 200; opacity:0; visibility:hidden; transition: opacity 0.2s ease, visibility 0.2s;
  }
  .account-modal-overlay.open{ opacity:1; visibility:visible; }
  .account-modal{
    background: var(--canvas); border-radius:12px; max-width: 340px; width:100%;
    padding: 24px; transform: scale(0.94); transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
  }
  .account-modal-overlay.open .account-modal{ transform: scale(1); }
  .account-modal h3{ margin: 0 0 6px; font-size:17px; }
  .account-modal p{ margin: 0 0 14px; font-size:13px; color: var(--fg-muted); }
  .account-modal input{
    width:100%; box-sizing:border-box; padding: 9px 12px; font-size:16px;
    border:1px solid var(--border); border-radius:6px; font-family:inherit;
    background: var(--canvas-inset); color: var(--fg); margin-bottom:14px;
  }
  .account-modal input:focus{ outline:none; border-color:var(--accent); }

  .page{ max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  h1{ font-size: 26px; font-weight:600; margin: 0 0 6px; animation: fadeInUp 0.5s ease both; }
  .subtitle{ color: var(--fg-muted); font-size:14.5px; margin: 0 0 24px; animation: fadeInUp 0.5s ease 0.05s both; }

  .search-wrap{ position:relative; margin-bottom: 28px; animation: fadeInUp 0.5s ease 0.1s both; }
  .search-wrap input{
    width:100%; padding: 10px 14px 10px 38px; font-size:16px;
    border:1px solid var(--border); border-radius:8px; font-family:inherit;
    background: var(--canvas-inset);
  }
  .search-wrap input{ transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; }
  .search-wrap input:focus{ outline:none; border-color: var(--accent); background: var(--canvas); box-shadow: 0 0 0 3px rgba(9,105,218,0.12); }
  .search-wrap .icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--fg-muted); font-size:14px; pointer-events:none; transition: transform 0.2s ease, color 0.2s ease; }
  .search-wrap input:focus ~ .icon{ transform: translateY(-50%) scale(1.15); color: var(--accent); }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .tile{
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
    background: var(--canvas); cursor:pointer; text-align:left;
    opacity:0; transform: translateY(14px);
    animation: fadeInUp 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
    transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s;
  }
  .tile:hover{ box-shadow: 0 8px 22px rgba(31,35,40,0.1); transform: translateY(-3px); border-color: var(--border-muted); }
  .tile:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:active{ transform: translateY(-1px) scale(0.99); }
  .tile.settle{ animation: settleIn 0.18s ease forwards; }
  .tile-img{
    position: relative;
    width:100%; aspect-ratio: 4/3; object-fit: cover;
    background: var(--canvas-inset);
    display:flex; align-items:center; justify-content:center;
    color: var(--fg-muted); font-size:12px; font-family: ui-monospace, monospace;
    overflow: hidden;
  }
  .tile-img img{ transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
  .tile:hover .tile-img img{ transform: scale(1.06); }
  .tile-body{ padding: 12px 14px 14px; }
  .tile-name{ font-weight:600; font-size:14.5px; margin-bottom:4px; }
  .tile-desc{ color: var(--fg-muted); font-size:13px; line-height:1.4; margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile-price{ font-family: ui-monospace, monospace; font-size:13px; color: var(--accent); font-weight:600; }
  .tile-model-row{ display:flex; gap:8px; margin-top:8px; }
  .tile-model-row a{
    flex:1; text-align:center; font-size:11.5px; font-weight:600;
    padding: 6px 8px; border-radius:6px; text-decoration:none;
    border:1px solid var(--border); color: var(--fg);
    transition: background 0.15s;
  }
  .tile-model-row a{ transition: background 0.15s, transform 0.15s ease; }
  .tile-model-row a:hover{ background: var(--canvas-inset); transform: translateY(-1px); }
  .tile-model-row a:active{ transform: translateY(0) scale(0.96); }
  .tile-model-row a.view3d{ color: var(--accent); border-color: rgba(9,105,218,0.35); }

  #empty, #loading{
    text-align:center; color: var(--fg-muted); padding: 60px 0; font-size:14px;
  }
  #empty{ animation: fadeInUp 0.4s ease both; }
  #loading{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  /* ---- skeleton shimmer (loading placeholders) ---- */
  .skeleton{
    background: linear-gradient(90deg, var(--canvas-inset) 25%, #eef1f4 37%, var(--canvas-inset) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  .skel-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .skel-tile{ border:1px solid var(--border-muted); border-radius:10px; overflow:hidden; opacity:0; animation: fadeInUp 0.4s ease forwards; }
  .skel-img{ width:100%; aspect-ratio:4/3; }
  .skel-line{ height:10px; margin:12px 14px; border-radius:4px; }
  .skel-line.short{ width:60%; }

  /* ---- order modal ---- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(31,35,40,0.4);
    display:flex; align-items:center; justify-content:center; padding: 20px;
    z-index: 100; opacity:0; visibility:hidden; transition: opacity 0.2s ease, visibility 0.2s;
  }
  .modal-overlay.open{ opacity:1; visibility:visible; }
  .modal{
    background: var(--canvas); border-radius:12px; max-width: 420px; width:100%;
    padding: 28px; transform: scale(0.94) translateY(8px); transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
    max-height: 88vh; overflow-y: auto;
  }
  .modal-overlay.open .modal{ transform: scale(1) translateY(0); }
  .modal h2{ font-size:19px; margin: 0 0 4px; }
  .modal .modal-price{ font-family: ui-monospace, monospace; color: var(--accent); font-size:14px; margin-bottom: 14px; }
  .modal .modal-desc{ color: var(--fg-muted); font-size:13.5px; margin-bottom: 20px; line-height:1.5; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .field input, .field textarea{
    width:100%; padding: 8px 11px; font-size:16px; border:1px solid var(--border);
    border-radius:6px; font-family:inherit; background:var(--canvas-inset);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); background: var(--canvas); box-shadow:0 0 0 3px rgba(9,105,218,0.12); }
  .field textarea{ min-height: 70px; resize: vertical; }
  .modal-actions{ display:flex; gap:10px; margin-top: 18px; }
  .modal-actions .btn{ flex:1; }
  .modal-close{
    position:absolute; top: 14px; right:14px; z-index: 2;
    background: rgba(255,255,255,0.85); box-shadow: 0 2px 8px rgba(31,35,40,0.15); border:none;
    font-size:18px; color: var(--fg); cursor:pointer; width:28px; height:28px; border-radius:50%;
    transition: background 0.15s, transform 0.2s ease;
  }
  .modal-close:hover{ background: #fff; transform: rotate(90deg); }
  .modal{ position: relative; }
  @keyframes shake{ 10%,90%{ transform: translateX(-1px); } 20%,80%{ transform: translateX(2px); } 30%,50%,70%{ transform: translateX(-4px); } 40%,60%{ transform: translateX(4px); } }
  .modal-error{ color: var(--err); font-size:13px; margin-top: 8px; display:none; }
  .modal-error.shake{ animation: shake 0.5s ease; }
  .modal.replay h2, .modal.replay .modal-price, .modal.replay .modal-desc{ animation: fadeInUp 0.35s ease both; }
  .modal.replay .modal-price{ animation-delay: 0.04s; }
  .modal.replay .modal-desc{ animation-delay: 0.08s; }

  /* ---- photo gallery (modal) ---- */
  .modal-gallery{
    position:relative; margin: -28px -28px 16px; aspect-ratio: 4/3;
    background: var(--canvas-inset); overflow:hidden;
  }
  .modal-gallery-track{
    display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .modal-gallery-track::-webkit-scrollbar{ display:none; }
  .modal-gallery-track img{
    flex: 0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:start;
  }
  .modal-gallery-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px;
    border-radius:50%; border:none; background:rgba(255,255,255,0.85); color:var(--fg);
    font-size:16px; cursor:pointer; align-items:center; justify-content:center;
    box-shadow: 0 2px 8px rgba(31,35,40,0.2); transition: background 0.15s, transform 0.15s ease;
  }
  .modal-gallery-arrow:hover{ background:#fff; transform:translateY(-50%) scale(1.08); }
  .modal-gallery-arrow.prev{ left:10px; }
  .modal-gallery-arrow.next{ right:10px; }
  .modal-gallery-dots{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px;
  }
  .modal-gallery-dot{
    width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.6);
    border:1px solid rgba(0,0,0,0.15); cursor:pointer; padding:0; transition: background 0.15s, transform 0.15s ease;
  }
  .modal-gallery-dot.active{ background:#fff; transform:scale(1.3); }
  .tile-photo-badge{
    position:absolute; bottom:8px; right:8px; background:rgba(31,35,40,0.65); color:#fff;
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px;
    display:flex; align-items:center; gap:3px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }

  /* ---- filament picker ---- */
  .fil-picker{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px; margin-top: 4px;
  }
  .fil-opt{ position: relative; }
  .fil-opt input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
  .fil-opt .card{
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    text-align: center; transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .fil-opt:hover .card{ border-color: var(--border-muted); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,35,40,0.08); }
  .fil-opt input:focus-visible + .card{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .fil-opt .swatch{
    width: 100%; aspect-ratio: 1/1; border-radius: 6px; margin-bottom: 6px;
    background-size: cover; background-position: center; background-color: var(--canvas-inset);
    border: 1px solid var(--border);
    transition: transform .15s ease;
  }
  .fil-opt .name{ font-size: 11.5px; font-weight: 600; line-height:1.3; }
  .fil-opt .meta{ font-size: 10.5px; color: var(--fg-muted); margin-top: 2px; }
  .fil-opt input:checked + .card{ border-color: var(--accent); background: rgba(9,105,218,0.08); animation: popIn 0.25s ease; }
  .fil-opt input:checked + .card .swatch{ transform: scale(1.06); }
  .fil-empty-note{ font-size: 12.5px; color: var(--fg-muted); display:flex; align-items:center; gap:6px; }
</style>
</head>

  (function(){
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function currentTheme(){
      const explicit = localStorage.getItem('theme');
      if (explicit) return explicit;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(mode){
      const isDark = mode === 'dark';
      toggle.textContent = isDark ? '☀️' : '🌙';
      toggle.setAttribute('aria-pressed', String(isDark));
    }
    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      document.documentElement.setAttribute('data-theme', next);
      applyTheme(next);
    });
    applyTheme(currentTheme());
  })();
</script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://paycasfatsakidsriwqt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Yk3l_-tXm4qtaRnrfw54pw_Awel9tCv';
  const BUCKET = 'order-files';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const gridEl = document.getElementById('grid');
  const loadingEl = document.getElementById('loading');
  const skelGridEl = document.getElementById('skel-grid');
  const emptyEl = document.getElementById('empty');
  const searchInput = document.getElementById('search-input');

  let presets = [];
  let firstRender = true;
  let selectedPreset = null;
  let filaments = [];
  let selectedFilament = null;

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function publicUrl(path){
    return path ? supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl : null;
  }

  async function loadFilaments(){
    const { data, error } = await supabase
      .from('filaments')
      .select('*')
      .eq('active', true)
      .order('sort_order', { ascending: true, nullsFirst: false })
      .order('created_at', { ascending: true });
    filaments = (!error && data) ? data : [];
    renderFilamentPicker();
  }

  function renderFilamentPicker(){
    const el = document.getElementById('fil-picker');
    if (filaments.length === 0){
      el.innerHTML = '<div class="fil-empty-note">No filament options set up yet — I\'ll confirm colour with you directly.</div>';
      return;
    }
    el.innerHTML = filaments.map(f => {
      const img = publicUrl(f.image_path);
      return `
        <label class="fil-opt">
          <input type="radio" name="m-filament" value="${f.id}">
          <div class="card">
            <div class="swatch" style="${img ? `background-image:url(${img})` : ''}"></div>
            <div class="name">${escapeHtml(f.color_name)}</div>
            <div class="meta">${escapeHtml(f.type)} · $${Number(f.price_per_100g).toFixed(2)}/100g</div>
          </div>
        </label>
      `;
    }).join('');
    el.querySelectorAll('input[name="m-filament"]').forEach(input => {
      input.addEventListener('change', () => {
        selectedFilament = filaments.find(f => f.id === input.value) || null;
      });
    });
  }

  async function loadPresets(){
    const { data, error } = await supabase
      .from('presets')
      .select('*')
      .eq('active', true)
      .order('created_at', { ascending: false });

    loadingEl.style.display = 'none';
    if (skelGridEl) skelGridEl.style.display = 'none';
    if (error || !data){
      emptyEl.textContent = 'Could not load presets right now.';
      emptyEl.style.display = 'block';
      return;
    }
    presets = data;
    render(presets);
  }

  let hasRenderedOnce = false;

  function render(list){
    gridEl.innerHTML = '';
    emptyEl.style.display = list.length === 0 ? 'block' : 'none';
    list.forEach((p, i) => {
      const tile = document.createElement('div');
      // full staggered entrance only on first load; re-filters get a quick, uniform settle so typing doesn't feel janky
      tile.className = hasRenderedOnce ? 'tile settle' : 'tile';
      tile.style.animationDelay = hasRenderedOnce ? '0s' : (i * 0.05) + 's';
      tile.setAttribute('role', 'button');
      tile.setAttribute('tabindex', '0');
      tile.setAttribute('aria-label', `Order ${p.name}`);
      const img = publicUrl(p.image_path);
      const photoCount = (p.image_path ? 1 : 0) + (p.image_paths?.length || 0);
      tile.innerHTML = `
        <div class="tile-img">${img ? `<img src="${img}" style="width:100%;height:100%;object-fit:cover;" alt="">` : 'No image'}${photoCount > 1 ? `<div class="tile-photo-badge">🖼 ${photoCount}</div>` : ''}</div>
        <div class="tile-body">
          <div class="tile-name">${escapeHtml(p.name)}</div>
          ${p.description ? `<div class="tile-desc">${escapeHtml(p.description)}</div>` : ''}
          ${p.price != null ? `<div class="tile-price">$${Number(p.price).toFixed(2)}</div>` : ''}
          ${p.model_path ? `
          <div class="tile-model-row">
            <a class="view3d" href="viewer.html?url=${encodeURIComponent(publicUrl(p.model_path))}&name=${encodeURIComponent(p.model_name || '')}" target="_blank" data-stop="1">👁 View in 3D</a>
            <a href="${publicUrl(p.model_path)}" download="${escapeHtml(p.model_name || 'model')}" data-stop="1">⇩ Download</a>
          </div>` : ''}
        </div>
      `;
      tile.addEventListener('click', (e) => {
        if (e.target.closest('[data-stop]')) return;
        openModal(p);
      });
      tile.addEventListener('keydown', (e) => {
        if (e.target.closest('[data-stop]')) return;
        if (e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          openModal(p);
        }
      });
      gridEl.appendChild(tile);
    });
    hasRenderedOnce = true;
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q ? presets : presets.filter(p =>
      p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)
    );
    render(filtered);
  });

  // ---- order modal ----
  const overlay = document.getElementById('modal-overlay');
  const form = document.getElementById('order-form');
  const errorEl = document.getElementById('modal-error');

  let lastFocusedEl = null;
  const modalEl = document.querySelector('.modal');
  function getPhotoUrls(preset){
    return [preset.image_path, ...(preset.image_paths || [])].filter(Boolean).map(publicUrl);
  }

  function setupGallery(photos){
    const galleryEl = document.getElementById('modal-gallery');
    const trackEl = document.getElementById('modal-gallery-track');
    const dotsEl = document.getElementById('modal-gallery-dots');
    const prevBtn = document.getElementById('gallery-prev');
    const nextBtn = document.getElementById('gallery-next');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (photos.length === 0){
      galleryEl.style.display = 'none';
      trackEl.innerHTML = '';
      dotsEl.innerHTML = '';
      return;
    }
    galleryEl.style.display = 'block';
    trackEl.innerHTML = photos.map(url => `<img src="${url}" alt="">`).join('');
    dotsEl.innerHTML = photos.length > 1
      ? photos.map((_, i) => `<button type="button" class="modal-gallery-dot${i === 0 ? ' active' : ''}" data-goto="${i}" aria-label="Photo ${i + 1}"></button>`).join('')
      : '';
    prevBtn.style.display = photos.length > 1 ? 'flex' : 'none';
    nextBtn.style.display = photos.length > 1 ? 'flex' : 'none';

    const dots = Array.from(dotsEl.querySelectorAll('.modal-gallery-dot'));
    function updateActive(){
      const idx = Math.round(trackEl.scrollLeft / trackEl.clientWidth);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }
    trackEl.onscroll = () => { window.requestAnimationFrame(updateActive); };
    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        trackEl.scrollTo({ left: Number(dot.dataset.goto) * trackEl.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
      });
    });
    prevBtn.onclick = () => trackEl.scrollBy({ left: -trackEl.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
    nextBtn.onclick = () => trackEl.scrollBy({ left: trackEl.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  function openModal(preset){
    lastFocusedEl = document.activeElement;
    selectedPreset = preset;
    if (modalEl){
      modalEl.classList.remove('replay');
      void modalEl.offsetWidth;
      modalEl.classList.add('replay');
    }
    selectedFilament = null;
    setupGallery(getPhotoUrls(preset));
    document.getElementById('modal-name').textContent = preset.name;
    document.getElementById('modal-price').textContent = preset.price != null ? `$${Number(preset.price).toFixed(2)}` : '';
    document.getElementById('modal-desc').textContent = preset.description || '';
    const modelRow = document.getElementById('modal-model-row');
    if (preset.model_path){
      const modelUrl = publicUrl(preset.model_path);
      modelRow.style.display = 'flex';
      modelRow.innerHTML = `
        <a class="view3d" href="viewer.html?url=${encodeURIComponent(modelUrl)}&name=${encodeURIComponent(preset.model_name || '')}" target="_blank">👁 View in 3D</a>
        <a href="${modelUrl}" download="${escapeHtml(preset.model_name || 'model')}">⇩ Download</a>
      `;
    } else {
      modelRow.style.display = 'none';
      modelRow.innerHTML = '';
    }
    form.reset();
    errorEl.style.display = 'none';
    overlay.classList.add('open');
    document.getElementById('m-name').focus();
  }
  function closeModal(){
    overlay.classList.remove('open');
    if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') lastFocusedEl.focus();
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('m-name').value.trim();
    const email = document.getElementById('m-email').value.trim();
    const notes = document.getElementById('m-notes').value.trim();
    if (!fullName || !email || !selectedPreset) return;

    const submitBtn = document.getElementById('modal-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Placing…';
    errorEl.style.display = 'none';

    try {
      const orderId = crypto.randomUUID();
      const { error } = await supabase.from('orders').insert({
        id: orderId,
        full_name: fullName,
        email: email,
        order_type: 'preset',
        notes: notes || null,
        preset_id: selectedPreset.id,
        preset_name: selectedPreset.name,
        preset_price: selectedPreset.price,
        filament_id: selectedFilament ? selectedFilament.id : null,
        filament_color: selectedFilament ? selectedFilament.color_name : null,
        filament_type: selectedFilament ? selectedFilament.type : null,
        filament_price_per_100g: selectedFilament ? selectedFilament.price_per_100g : null
      });
      if (error) throw error;

      const orderUrl = new URL('order.html', window.location.href);
      orderUrl.searchParams.set('order', orderId);
      window.location.href = orderUrl.href;

    } catch (err){
      errorEl.textContent = 'Could not place order: ' + (err.message || 'please try again.');
      errorEl.style.display = 'block';
      errorEl.classList.remove('shake');
      void errorEl.offsetWidth;
      errorEl.classList.add('shake');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Place order';
    }
  });

  loadPresets();
  loadFilaments();

  // ---- customer account (Google sign-in) ----
  (function(){
    const signInBtn = document.getElementById('google-signin-btn');
    if (!signInBtn) return;
    const accountChip = document.getElementById('account-chip');
    const accountName = document.getElementById('account-name');
    const accountAvatar = document.getElementById('account-avatar');
    const signOutBtn = document.getElementById('account-signout-btn');
    const nameOverlay = document.getElementById('account-name-overlay');
    const nameInput = document.getElementById('account-name-input');
    const nameSaveBtn = document.getElementById('account-name-save');

    let pendingUser = null;

    function renderSignedOut(){
      signInBtn.style.display = 'flex';
      accountChip.style.display = 'none';
    }
    function renderSignedIn(user, profile){
      signInBtn.style.display = 'none';
      accountChip.style.display = 'flex';
      accountName.textContent = (profile?.full_name || user.email || '').split(' ')[0];
      accountAvatar.src = user.user_metadata?.avatar_url || '';
    }

    async function ensureProfile(user){
      const { data: profile } = await supabase.from('customer_profiles').select('*').eq('id', user.id).maybeSingle();
      if (profile) return profile;
      pendingUser = user;
      nameInput.value = user.user_metadata?.full_name || '';
      nameOverlay.classList.add('open');
      return null;
    }

    nameSaveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || !pendingUser) return;
      const { error } = await supabase.from('customer_profiles').insert({
        id: pendingUser.id, email: pendingUser.email, full_name: name,
        avatar_url: pendingUser.user_metadata?.avatar_url || null
      });
      if (!error){
        nameOverlay.classList.remove('open');
        renderSignedIn(pendingUser, { full_name: name });
      }
    });

    signInBtn.addEventListener('click', () => {
      supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    });
    signOutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      renderSignedOut();
    });

    (async function init(){
      const { data: { session } } = await supabase.auth.getSession();
      if (session){
        const profile = await ensureProfile(session.user);
        if (profile) renderSignedIn(session.user, profile);
      } else {
        renderSignedOut();
      }
    })();
  })();
</script>

</body>
</html>
