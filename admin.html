<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoshPrints — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1d1f;
    --bg-raised: #232628;
    --bg-raised-2: #2a2d30;
    --grid-line: rgba(242,239,234,0.045);
    --ink: #f2efea;
    --ink-dim: #a9adb2;
    --accent: #ff6a1a;
    --accent-dim: #ff6a1a33;
    --ok: #3fa66b;
    --ok-dim: #3fa66b22;
    --err: #e2544a;
    --warn: #e2b13f;
    --warn-dim: #e2b13f22;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 34px,
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ---- Login screen ---- */
  #login-view{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card{
    width: 100%;
    max-width: 360px;
    background: var(--bg-raised);
    border: 1px solid rgba(242,239,234,0.08);
    border-radius: var(--radius);
    padding: 32px;
  }
  .login-card h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    margin: 0 0 4px;
  }
  .login-card h1 span{ color: var(--accent); }
  .login-card p.sub{ color: var(--ink-dim); font-size: 13px; margin: 0 0 24px; }
  .login-card label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .login-card input{
    width:100%;
    background: var(--bg);
    border: 1px solid rgba(242,239,234,0.12);
    border-radius: 6px;
    color: var(--ink);
    padding: 11px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  .login-card input:focus{ border-color: var(--accent); }
  .login-card button{
    width: 100%;
    background: var(--accent);
    color: #1b1305;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .login-card button:disabled{ opacity: .6; cursor: default; }
  .login-err{
    color: #f2a49e;
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 14px;
    display: none;
  }
  .login-err.show{ display: block; }

  /* ---- Dashboard ---- */
  #dash-view{ display:none; }
  .topbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid rgba(242,239,234,0.08);
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    margin: 0;
  }
  .topbar h1 span{ color: var(--accent); }
  .topbar .right{ display:flex; align-items:center; gap:12px; }
  .icon-btn{
    background: var(--bg-raised);
    border: 1px solid rgba(242,239,234,0.12);
    color: var(--ink-dim);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .icon-btn:hover{ color: var(--ink); border-color: rgba(242,239,234,0.25); }

  .toolbar{
    display:flex;
    gap: 10px;
    padding: 18px 28px 0;
    flex-wrap: wrap;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid rgba(242,239,234,0.14);
    color: var(--ink-dim);
    cursor: pointer;
    background: transparent;
  }
  .chip.active{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  main{ padding: 20px 28px 60px; max-width: 1100px; margin: 0 auto; }

  .order-card{
    background: var(--bg-raised);
    border: 1px solid rgba(242,239,234,0.08);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .order-top{
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    gap: 14px;
    flex-wrap: wrap;
  }
  .order-name{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
  }
  .order-meta{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .order-type-badge{
    display:inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--accent-dim);
    color: var(--accent);
    margin-right: 8px;
  }
  .order-notes{
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--bg);
    border-radius: 6px;
    padding: 10px 12px;
    white-space: pre-wrap;
  }
  .order-file{
    margin-top: 10px;
  }
  .order-file a{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
  }
  .order-file a:hover{ text-decoration: underline; }
  .order-bottom{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  select.status-select{
    background: var(--bg);
    border: 1px solid rgba(242,239,234,0.14);
    color: var(--ink);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .quote-input{
    background: var(--bg);
    border: 1px solid rgba(242,239,234,0.14);
    color: var(--ink);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    width: 110px;
  }
  .save-btn{
    background: var(--ok-dim);
    border: 1px solid var(--ok);
    color: #a7e6c1;
    border-radius: 6px;
    padding: 7px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .save-btn:hover{ filter: brightness(1.1); }
  .row-status{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }

  .chat-toggle{
    background: none;
    border: 1px solid rgba(242,239,234,0.14);
    color: var(--ink-dim);
    border-radius: 6px;
    padding: 7px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .chat-toggle:hover{ color: var(--ink); }

  .chat-panel{
    display: none;
    margin-top: 14px;
    border-top: 1px solid rgba(242,239,234,0.08);
    padding-top: 14px;
  }
  .chat-panel.open{ display: block; }
  .chat-messages{
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .chat-msg{
    max-width: 80%;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.4;
  }
  .chat-msg.admin{
    align-self: flex-end;
    background: var(--accent-dim);
    border: 1px solid rgba(255,106,26,0.3);
  }
  .chat-msg.customer{
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid rgba(242,239,234,0.1);
  }
  .chat-msg .who{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .chat-msg .file-link{
    display: inline-block;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
  }
  .chat-empty{
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: center;
    padding: 14px 0;
  }
  .chat-composer{ display: flex; flex-direction: column; gap: 8px; }
  .chat-composer textarea{
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(242,239,234,0.14);
    border-radius: 6px;
    color: var(--ink);
    padding: 9px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    resize: vertical;
    min-height: 46px;
  }
  .chat-composer-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .chat-attach{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    border: 1px dashed rgba(242,239,234,0.2);
    border-radius: 6px;
    padding: 6px 10px;
    position: relative;
    cursor: pointer;
  }
  .chat-attach input{ position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .chat-send{
    background: var(--accent);
    color: #1b1305;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }

  .status-dot{
    display:inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-new .status-dot{ background: var(--accent); }
  .status-quoted .status-dot{ background: var(--warn); }
  .status-in_progress .status-dot{ background: #6fa8ff; }
  .status-completed .status-dot{ background: var(--ok); }
  .status-cancelled .status-dot{ background: #6b7178; }

  .empty{
    text-align: center;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 60px 0;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-card">
    <h1>Josh<span>Prints</span></h1>
    <p class="sub">Admin — sign in to view orders</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="login-btn">Sign in</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash-view">
  <div class="topbar">
    <h1>Josh<span>Prints</span> — Orders</h1>
    <div class="right">
      <button class="icon-btn" id="refresh-btn">Refresh</button>
      <button class="icon-btn" id="logout-btn">Sign out</button>
    </div>
  </div>
  <div class="toolbar" id="filter-bar">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="new">New</button>
    <button class="chip" data-filter="quoted">Quoted</button>
    <button class="chip" data-filter="in_progress">In progress</button>
    <button class="chip" data-filter="completed">Completed</button>
    <button class="chip" data-filter="cancelled">Cancelled</button>
    <button class="chip" data-filter="deleted">Deleted</button>
  </div>
  <main>
    <div id="orders-container"><div class="empty">Loading…</div></div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://paycasfatsakidsriwqt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Yk3l_-tXm4qtaRnrfw54pw_Awel9tCv';
  const BUCKET = 'order-files';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginView = document.getElementById('login-view');
  const dashView = document.getElementById('dash-view');
  const loginForm = document.getElementById('login-form');
  const loginErr = document.getElementById('login-err');
  const loginBtn = document.getElementById('login-btn');
  const ordersContainer = document.getElementById('orders-container');
  const filterBar = document.getElementById('filter-bar');

  let currentOrders = [];
  let activeFilter = 'all';
  let openChatOrderId = null;
  let chatPollTimer = null;

  const STATUS_OPTIONS = ['new', 'quoted', 'in_progress', 'completed', 'cancelled'];
  const STATUS_LABEL = {
    new: 'New', quoted: 'Quoted', in_progress: 'In progress',
    completed: 'Completed', cancelled: 'Cancelled'
  };

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function checkSession(){
    const { data: { session } } = await supabase.auth.getSession();
    if (session){
      showDashboard();
    } else {
      showLogin();
    }
  }

  function showLogin(){
    loginView.style.display = 'flex';
    dashView.style.display = 'none';
  }

  function showDashboard(){
    loginView.style.display = 'none';
    dashView.style.display = 'block';
    loadOrders();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginErr.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';

    if (error){
      loginErr.textContent = error.message;
      loginErr.classList.add('show');
      return;
    }
    showDashboard();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    showLogin();
  });

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);

  filterBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filterBar.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderOrders();
  });

  async function loadOrders(){
    ordersContainer.innerHTML = '<div class="empty">Loading…</div>';
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    if (error){
      ordersContainer.innerHTML = `<div class="empty">Couldn't load orders: ${escapeHtml(error.message)}</div>`;
      return;
    }
    currentOrders = data || [];
    renderOrders();
  }

  function renderOrders(){
    const filtered = activeFilter === 'deleted'
      ? currentOrders.filter(o => o.deleted)
      : activeFilter === 'all'
        ? currentOrders.filter(o => !o.deleted)
        : currentOrders.filter(o => !o.deleted && o.status === activeFilter);

    if (filtered.length === 0){
      ordersContainer.innerHTML = '<div class="empty">No orders here.</div>';
      return;
    }

    ordersContainer.innerHTML = '';
    filtered.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';

      const typeLabel = order.order_type === 'custom_model' ? 'Custom Model' : 'Custom Print';
      const created = new Date(order.created_at).toLocaleString();

      card.innerHTML = `
        <div class="order-top">
          <div>
            <div class="order-name">${escapeHtml(order.full_name)}</div>
            <div class="order-meta">
              <span class="order-type-badge">${typeLabel}</span>${created}
            </div>
          </div>
          <div class="row-status status-${order.status}"><span class="status-dot"></span>${STATUS_LABEL[order.status] || order.status}</div>
        </div>
        ${order.notes ? `<div class="order-notes">${escapeHtml(order.notes)}</div>` : ''}
        ${(() => {
          const files = (order.files && order.files.length > 0)
            ? order.files
            : (order.file_path ? [{ path: order.file_path, name: order.file_name }] : []);
          return files.map(f => `<div class="order-file"><a href="#" class="file-link" data-path="${escapeHtml(f.path)}">⇩ ${escapeHtml(f.name || 'download file')}</a></div>`).join('');
        })()}
        <div class="order-bottom">
          <select class="status-select" data-id="${order.id}">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
          </select>
          <input type="text" class="quote-input" placeholder="Quote $" data-id="${order.id}" value="${order.quote_amount ?? ''}">
          <button class="save-btn" data-id="${order.id}">Save</button>
          <button class="chat-toggle" data-id="${order.id}">💬 Messages</button>
          <button class="chat-toggle copy-link-btn" data-id="${order.id}">🔗 Copy link</button>
          ${order.deleted
            ? `<button class="chat-toggle restore-btn" data-id="${order.id}">♻️ Restore</button>`
            : `<button class="chat-toggle delete-btn" data-id="${order.id}">🗑 Delete</button>`
          }
        </div>
        <div class="chat-panel" id="chat-panel-${order.id}">
          <div class="chat-messages" id="chat-messages-${order.id}"><div class="chat-empty">Loading…</div></div>
          <div class="chat-composer">
            <textarea placeholder="Reply to ${escapeHtml(order.full_name)}…" id="chat-body-${order.id}"></textarea>
            <div class="chat-composer-row">
              <label class="chat-attach">
                <span id="chat-attach-label-${order.id}">📎 Attach file</span>
                <input type="file" id="chat-attach-${order.id}" multiple>
              </label>
              <button class="chat-send" data-id="${order.id}">Send</button>
            </div>
          </div>
        </div>
      `;
      ordersContainer.appendChild(card);
    });

    // File download links -> public URL (bucket is public; path is the only secret)
    ordersContainer.querySelectorAll('.file-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const path = link.dataset.path;
        const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
        window.open(data.publicUrl, '_blank');
      });
    });

    // Copy link buttons
    ordersContainer.querySelectorAll('.copy-link-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const url = new URL('order.html', window.location.href);
        url.searchParams.set('order', id);
        try {
          await navigator.clipboard.writeText(url.href);
          const original = btn.textContent;
          btn.textContent = '✓ Copied';
          setTimeout(() => { btn.textContent = original; }, 1500);
        } catch (e) {
          prompt('Copy this link:', url.href);
        }
      });
    });

    // Delete / restore buttons
    ordersContainer.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => setDeleted(btn.dataset.id, true));
    });
    ordersContainer.querySelectorAll('.restore-btn').forEach(btn => {
      btn.addEventListener('click', () => setDeleted(btn.dataset.id, false));
    });

    // Chat toggles
    ordersContainer.querySelectorAll('.chat-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const panel = document.getElementById(`chat-panel-${id}`);
        panel.classList.toggle('open');
        if (panel.classList.contains('open')){
          openChatOrderId = id;
          loadChat(id);
          if (chatPollTimer) clearInterval(chatPollTimer);
          chatPollTimer = setInterval(() => loadChat(id), 3000);
        } else if (openChatOrderId === id){
          openChatOrderId = null;
          if (chatPollTimer) clearInterval(chatPollTimer);
        }
      });
    });

    // Chat attach labels
    ordersContainer.querySelectorAll('[id^="chat-attach-"]').forEach(input => {
      const id = input.id.replace('chat-attach-', '');
      input.addEventListener('change', () => {
        const label = document.getElementById(`chat-attach-label-${id}`);
        const n = input.files.length;
        label.textContent = n === 0 ? '📎 Attach file'
          : n === 1 ? `📎 ${input.files[0].name}`
          : `📎 ${n} files`;
      });
    });

    // Chat send buttons
    ordersContainer.querySelectorAll('.chat-send').forEach(btn => {
      btn.addEventListener('click', () => sendChatMessage(btn.dataset.id));
    });

    // Save buttons
    ordersContainer.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const select = ordersContainer.querySelector(`.status-select[data-id="${id}"]`);
        const quoteInput = ordersContainer.querySelector(`.quote-input[data-id="${id}"]`);

        const newStatus = select.value;
        const quoteRaw = quoteInput.value.trim();
        const quoteAmount = quoteRaw === '' ? null : Number(quoteRaw);

        btn.disabled = true;
        btn.textContent = 'Saving…';

        const { error } = await supabase
          .from('orders')
          .update({ status: newStatus, quote_amount: quoteAmount })
          .eq('id', id);

        btn.disabled = false;
        btn.textContent = 'Save';

        if (error){
          alert('Could not save: ' + error.message);
          return;
        }
        const idx = currentOrders.findIndex(o => o.id === id);
        if (idx > -1){
          currentOrders[idx].status = newStatus;
          currentOrders[idx].quote_amount = quoteAmount;
        }
        renderOrders();
      });
    });
  }

  async function setDeleted(id, deleted){
    if (deleted && !confirm('Delete this order? The customer will no longer be able to message you about it.')) {
      return;
    }

    const { error } = await supabase
      .from('orders')
      .update({ deleted })
      .eq('id', id);

    if (error){
      alert('Could not update: ' + error.message);
      return;
    }

    const idx = currentOrders.findIndex(o => o.id === id);
    if (idx > -1) currentOrders[idx].deleted = deleted;
    renderOrders();
  }

  function sanitizeFileName(name){
    return name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  }

  async function loadChat(orderId){
    const container = document.getElementById(`chat-messages-${orderId}`);
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .eq('order_id', orderId)
      .order('created_at', { ascending: true });

    if (error){
      container.innerHTML = `<div class="chat-empty">Couldn't load messages.</div>`;
      return;
    }
    if (!data || data.length === 0){
      container.innerHTML = '<div class="chat-empty">No messages yet.</div>';
      return;
    }

    container.innerHTML = data.map(m => {
      const fileLinks = [];
      if (m.file_path) fileLinks.push({ path: m.file_path, name: m.file_name });
      (m.files || []).forEach(f => fileLinks.push(f));
      return `
      <div class="chat-msg ${m.sender}">
        <div class="who">${m.sender === 'admin' ? 'You' : 'Customer'}</div>
        ${m.body ? `<div>${escapeHtml(m.body)}</div>` : ''}
        ${fileLinks.map(f => `<a class="file-link" href="#" data-path="${escapeHtml(f.path)}" target="_blank">📎 ${escapeHtml(f.name || 'attachment')}</a>`).join('')}
      </div>
    `;
    }).join('');

    container.querySelectorAll('.file-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const { data } = supabase.storage.from(BUCKET).getPublicUrl(link.dataset.path);
        window.open(data.publicUrl, '_blank');
      });
    });

    container.scrollTop = container.scrollHeight;
  }

  async function sendChatMessage(orderId){
    const bodyEl = document.getElementById(`chat-body-${orderId}`);
    const fileInput = document.getElementById(`chat-attach-${orderId}`);
    const body = bodyEl.value.trim();
    const files = Array.from(fileInput.files);

    if (!body && files.length === 0) return;

    try {
      const uploaded = [];
      for (const file of files){
        const path = `messages/${orderId}/${Date.now()}-${sanitizeFileName(file.name)}`;
        const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, file);
        if (upErr) throw upErr;
        uploaded.push({ path, name: file.name });
      }

      const { error } = await supabase.from('messages').insert({
        order_id: orderId,
        sender: 'admin',
        body: body || null,
        file_path: uploaded[0]?.path || null,
        file_name: uploaded[0]?.name || null,
        files: uploaded
      });
      if (error) throw error;

      bodyEl.value = '';
      fileInput.value = '';
      document.getElementById(`chat-attach-label-${orderId}`).textContent = '📎 Attach file';
      loadChat(orderId);

    } catch (err){
      alert('Could not send: ' + (err.message || 'please try again'));
    }
  }

  checkSession();
</script>

</html>
