<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vox Craft — Voxprints games</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<script src="/error-log.js"></script>
<script src="/signin-link.js?v=2"></script>
<script src="/update-check.js" defer></script>
<script src="/game-ui.js?v=1" defer></script>
<style>
  html{ touch-action: manipulation; }
  body{ -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input{ -webkit-user-select: text; user-select: text; }
  .ico{ width:1em; height:1em; vertical-align:-0.15em; flex-shrink:0; }
  :root{
    --canvas: #ffffff; --canvas-inset: #f6f8fa; --border: #d1d9e0; --border-muted: #d8dee4;
    --fg: #1f2328; --fg-muted: #59636e; --accent: #0969da; --btn-hover-bg: #f3f4f6; --ok: #1a7f37;
    --dot: rgba(31,35,40,.09);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas: #0d1117; --canvas-inset: #161b22; --border: #30363d; --border-muted: #21262d;
      --fg: #e6edf3; --fg-muted: #8b949e; --accent: #4493f8; --btn-hover-bg: #21262d; --ok: #3fb950;
      --dot: rgba(255,255,255,.07);
    }
  }
  :root[data-theme="dark"]{
    --canvas: #0d1117; --canvas-inset: #161b22; --border: #30363d; --border-muted: #21262d;
    --fg: #e6edf3; --fg-muted: #8b949e; --accent: #4493f8; --btn-hover-bg: #21262d; --ok: #3fb950;
    --dot: rgba(255,255,255,.07);
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{ margin: 0; background: var(--canvas); color: var(--fg); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  .topbar{ display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-muted); flex-shrink: 0; }
  .topbar a{ color: var(--fg); text-decoration: none; font-weight: 600; font-size: 14px; }
  .topbar .title{ margin-right: auto; font-weight: 800; letter-spacing: -.01em; }
  .tbtn{ font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; background: var(--canvas-inset); color: var(--fg); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
  .tbtn:hover{ background: var(--btn-hover-bg); }
  .count{ font-size: 13px; color: var(--fg-muted); }

  .game{ flex: 1; display: flex; min-height: 0; }
  .board{ flex: 1; position: relative; overflow: hidden; touch-action: none;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 22px 22px; }
  .hint{ position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: var(--fg-muted); font-size: 14px; text-align: center; pointer-events: none; padding: 0 20px; }
  .side{ width: 320px; border-left: 1px solid var(--border-muted); display: flex; flex-direction: column; background: var(--canvas); min-height: 0; }
  .side-head{ padding: 10px; display: flex; gap: 8px; border-bottom: 1px solid var(--border-muted); }
  .side-head input{ flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--canvas-inset); color: var(--fg); }
  .side-head select{ font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--canvas-inset); color: var(--fg); padding: 0 6px; }
  .list{ flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 7px; touch-action: pan-y; }

  .item{ display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; line-height: 1.2;
    background: var(--canvas); color: var(--fg); border: 1px solid var(--border); cursor: grab; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .item:hover{ border-color: var(--accent); }
  .item.newest{ border-color: var(--accent); box-shadow: 0 0 0 2px rgba(68,147,248,.2); }
  .board .item{ position: absolute; box-shadow: 0 2px 8px rgba(0,0,0,.12); touch-action: none; }
  .board .item.drag{ cursor: grabbing; z-index: 50; box-shadow: 0 10px 24px rgba(0,0,0,.25); transform: scale(1.05); }
  .board .item.target{ border-color: var(--accent); background: rgba(68,147,248,.14); }
  .board .item.busy{ opacity: .7; animation: busy .8s ease-in-out infinite; }
  .board .item.pop{ animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  .board .item.nope{ animation: nope .35s ease; }
  @keyframes busy{ 50%{ transform: scale(.95); } }
  @keyframes pop{ from{ transform: scale(.4); opacity: 0; } to{ transform: scale(1); opacity: 1; } }
  @keyframes nope{ 25%{ transform: translateX(-5px); } 75%{ transform: translateX(5px); } }
  .toast{ position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; pointer-events: none;
    background: var(--canvas-inset); border: 1px solid var(--border); color: var(--fg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 100; white-space: nowrap; }
  .toast.on{ opacity: 1; transform: translateX(-50%); }
  .toast.first{ border-color: var(--ok); color: var(--ok); }
  .trash{ position: absolute; left: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--canvas-inset); border: 1px solid var(--border); color: var(--fg-muted); font-size: 18px; opacity: 0; transition: .2s; pointer-events: none; }
  .trash.on{ opacity: 1; }
  .trash.over{ color: #f85149; border-color: #f85149; transform: scale(1.12); }
  @media (max-width: 760px){
    .game{ flex-direction: column; }
    .side{ width: 100%; height: 42%; border-left: 0; border-top: 1px solid var(--border-muted); }
    .topbar .lg{ display: none; }
  }
  @media (prefers-reduced-motion: reduce){ .board .item{ animation: none !important; } }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/games.html">&larr; Games</a>
    <span class="title">Vox Craft</span>
    <span class="count" id="count"></span>
    <button type="button" class="tbtn" id="clear" title="Clear the board"><svg class="ico" aria-hidden="true"><use href="/icons.svg#trash-2"/></svg><span class="lg">Clear</span></button>
  </div>
  <div class="game">
    <div class="board" id="board">
      <div class="hint" id="hint">Drag items here, then drop one onto another to combine them.</div>
      <div class="trash" id="trash" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="/icons.svg#trash-2"/></svg></div>
    </div>
    <div class="side">
      <div class="side-head">
        <input type="search" id="search" placeholder="Search" aria-label="Search items" autocomplete="off">
        <select id="sort" aria-label="Sort"><option value="time">Newest</option><option value="az">A–Z</option></select>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { startLive } from '/live.js?v=2';
  const sb = createClient('https://paycasfatsakidsriwqt.supabase.co', 'sb_publishable_Yk3l_-tXm4qtaRnrfw54pw_Awel9tCv');
  const $ = id => document.getElementById(id);
  const board = $('board'), list = $('list'), trash = $('trash');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---- what you've found (kept in this browser) ----
  const BASE = ['Water', 'Fire', 'Wind', 'Earth'];
  const KEY = 'vxcraft-items';
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  if (!Array.isArray(items) || !items.length) items = BASE.slice();
  BASE.forEach(b => { if (!items.includes(b)) items.unshift(b); });
  let newest = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };
  function renderList(){
    const q = $('search').value.trim().toLowerCase();
    let shown = items.filter(n => !q || n.toLowerCase().includes(q));
    shown = $('sort').value === 'az' ? shown.slice().sort((a, b) => a.localeCompare(b)) : shown.slice().reverse();
    list.innerHTML = shown.map(n => `<div class="item${n === newest ? ' newest' : ''}" data-name="${esc(n)}">${esc(n)}</div>`).join('');
    $('count').textContent = items.length + ' items';
  }
  $('search').addEventListener('input', renderList);
  $('sort').addEventListener('change', renderList);

  let toastT = null;
  function toast(t, first){
    const el = $('toast'); el.textContent = t; el.className = 'toast on' + (first ? ' first' : '');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200);
  }

  // ---- the board ----
  function hint(){ $('hint').hidden = !!board.querySelector('.item'); }
  function place(name, x, y, cls){
    const el = document.createElement('div');
    el.className = 'item' + (cls ? ' ' + cls : ''); el.textContent = name; el.dataset.name = name;
    board.appendChild(el);
    const r = board.getBoundingClientRect();
    el.style.left = Math.max(4, Math.min(r.width - el.offsetWidth - 4, x - el.offsetWidth / 2)) + 'px';
    el.style.top = Math.max(4, Math.min(r.height - el.offsetHeight - 4, y - el.offsetHeight / 2)) + 'px';
    hint();
    return el;
  }
  const centre = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  function overlapping(el){
    const a = el.getBoundingClientRect();
    let best = null, bestD = 1e9;
    board.querySelectorAll('.item:not(.busy)').forEach(o => {
      if (o === el) return;
      const b = o.getBoundingClientRect();
      if (a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom) return;
      const d = Math.hypot((a.left + a.right - b.left - b.right) / 2, (a.top + a.bottom - b.top - b.bottom) / 2);
      if (d < bestD){ bestD = d; best = o; }
    });
    return best;
  }

  async function combine(a, b){
    a.classList.add('busy'); b.classList.add('busy');
    let res = null, err = null;
    try {
      const { data, error } = await sb.functions.invoke('craft', { body: { a: a.dataset.name, b: b.dataset.name } });
      if (error){ try { err = (await error.context.json()).error; } catch (e) { err = 'Try again.'; } }
      else res = data;
    } catch (e){ err = 'Try again.'; }
    a.classList.remove('busy'); b.classList.remove('busy');
    if (err || !res || !res.result){
      [a, b].forEach(el => { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); });
      toast(err || 'Nothing happened.');
      return;
    }
    const ca = centre(a), cb = centre(b), br = board.getBoundingClientRect();
    a.remove(); b.remove();
    const el = place(res.result, (ca.x + cb.x) / 2 - br.left, (ca.y + cb.y) / 2 - br.top, 'pop');
    if (!items.includes(res.result)){
      items.push(res.result); newest = res.result; save(); renderList();
      toast(res.first ? 'First discovery: ' + res.result : 'New: ' + res.result, res.first);
    }
    return el;
  }

  // ---- dragging (mouse and touch): from the list makes a copy, on the board moves it ----
  let drag = null;
  function start(e, el, fromList){
    if (e.button > 0) return;
    e.preventDefault();
    const br = board.getBoundingClientRect();
    if (fromList){
      el = place(el.dataset.name, e.clientX - br.left, e.clientY - br.top);
      // on phones the list sits under the board: start the copy where the finger is, even outside the board
      el.style.left = (e.clientX - br.left - el.offsetWidth / 2) + 'px';
      el.style.top = (e.clientY - br.top - el.offsetHeight / 2) + 'px';
    }
    const r = el.getBoundingClientRect();
    drag = { el, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, fromList, id: e.pointerId };
    el.classList.add('drag');
    trash.classList.add('on');
  }
  list.addEventListener('pointerdown', e => {
    const it = e.target.closest('.item'); if (!it) return;
    // phones: a quick tap places the item; a drag that starts by going sideways or up pulls it out; a vertical swipe scrolls the list
    if (e.pointerType === 'touch'){
      const sx = e.clientX, sy = e.clientY;
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (Math.hypot(dx, dy) < 8) return;
        cleanup();
        if (dy < -Math.abs(dx) * 0.6 || Math.abs(dx) > Math.abs(dy)) start(ev, it, true);
      };
      const up = ev => { cleanup(); if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) tapPlace(it.dataset.name); };
      const cleanup = () => { list.removeEventListener('pointermove', move); list.removeEventListener('pointerup', up); list.removeEventListener('pointercancel', cleanup); };
      list.addEventListener('pointermove', move); list.addEventListener('pointerup', up); list.addEventListener('pointercancel', cleanup);
      return;
    }
    start(e, it, true);
  });
  function tapPlace(name){
    const br = board.getBoundingClientRect(), n = board.querySelectorAll('.item').length;
    const el = place(name, br.width * (0.25 + Math.random() * 0.5), br.height * (0.25 + Math.random() * 0.5) + (n % 4) * 6, 'pop');
    return el;
  }
  board.addEventListener('pointerdown', e => { const it = e.target.closest('.item'); if (it && !it.classList.contains('busy')) start(e, it, false); });
  board.addEventListener('dblclick', e => {
    const it = e.target.closest('.item'); if (!it) return;
    const c = centre(it), br = board.getBoundingClientRect();
    place(it.dataset.name, c.x - br.left + 24, c.y - br.top + 24, 'pop');
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
    const br = board.getBoundingClientRect();
    drag.el.style.left = (e.clientX - br.left - drag.dx) + 'px';
    drag.el.style.top = (e.clientY - br.top - drag.dy) + 'px';
    board.querySelectorAll('.target').forEach(t => t.classList.remove('target'));
    const o = overlapping(drag.el); if (o) o.classList.add('target');
    const tr = trash.getBoundingClientRect();
    trash.classList.toggle('over', e.clientX >= tr.left - 10 && e.clientX <= tr.right + 10 && e.clientY >= tr.top - 10 && e.clientY <= tr.bottom + 10);
  });
  function end(e){
    if (!drag || e.pointerId !== drag.id) return;
    const { el, fromList } = drag; drag = null;
    el.classList.remove('drag');
    board.querySelectorAll('.target').forEach(t => t.classList.remove('target'));
    const overTrash = trash.classList.contains('over');
    trash.classList.remove('on', 'over');
    const br = board.getBoundingClientRect(), c = centre(el);
    const outside = c.x < br.left || c.x > br.right || c.y < br.top || c.y > br.bottom;
    if (overTrash || outside){ el.remove(); hint(); return; }   // dropped back on the list (or the bin): gone
    el.style.left = Math.max(0, Math.min(br.width - el.offsetWidth, el.offsetLeft)) + 'px';
    el.style.top = Math.max(0, Math.min(br.height - el.offsetHeight, el.offsetTop)) + 'px';
    const o = overlapping(el);
    if (o) combine(el, o);
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  $('clear').addEventListener('click', () => { board.querySelectorAll('.item').forEach(el => el.remove()); hint(); });

  renderList(); hint();

  // ---- who's playing now (the "N playing" button and the games page strip) ----
  let user = null;
  sb.auth.getSession().then(({ data }) => { user = data.session ? data.session.user : null; });
  sb.auth.onAuthStateChange((_e, s) => { user = s ? s.user : null; });
  startLive({ sb: () => sb, user: () => user, game: 'craft', statsGame: 'dune', title: 'Vox Craft', score: () => items.length });
</script>
</body>
</html>
