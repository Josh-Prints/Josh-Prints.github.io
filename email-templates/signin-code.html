<!-- Supabase Auth email template (Authentication > Emails > Templates): use for "Magic Link" (returning users; first-time users get welcome-code.html via "Confirm signup").
     Subject: Your Voxprints sign-in code. {{ .Token }} is the 6-digit code. Logo: https://voxprints.com/logo-email.png -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d1117;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
      <tr><td align="center" style="padding:0 0 20px;">
        <img src="https://voxprints.com/logo-email.png" width="44" height="44" alt="" style="display:inline-block;vertical-align:middle;border:0;">
        <span style="display:inline-block;vertical-align:middle;margin-left:8px;font-size:24px;font-weight:700;color:#e6edf3;letter-spacing:-0.3px;">Vox<span style="color:#4493f8;">prints</span></span>
      </td></tr>
      <tr><td style="background:#161b22;border:1px solid #30363d;border-radius:14px;padding:30px 26px;" align="center">
        <div style="font-size:20px;font-weight:700;color:#e6edf3;margin:0 0 6px;">Your sign-in code</div>
        <div style="font-size:14px;color:#8b949e;margin:0 0 22px;">Enter this code on Voxprints to sign in.</div>
        <div style="display:inline-block;background:#0d1117;border:1px solid #4493f8;border-radius:10px;padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#ffffff;">{{ .Token }}</div>
        <div style="font-size:12.5px;color:#8b949e;margin:22px 0 0;">Expires soon. Didn't ask for this? Just ignore it.</div>
      </td></tr>
      <tr><td align="center" style="padding:18px 0 0;font-size:12px;color:#6e7681;">
        Voxprints · 3D printing made in Australia · <a href="https://voxprints.com" style="color:#4493f8;text-decoration:none;">voxprints.com</a>
      </td></tr>
    </table>
  </td></tr>
</table>
